<style>[hidden]{display:none!important}
:root{--night:#0c1626;--gold:#efbe4c;--gold-deep:#b9821d;--parchment:#f7ecd4;--muted:#9fb0c7;--emerald:#3ddc84}
*{box-sizing:border-box}html,body{margin:0;background:var(--night);color:var(--parchment);font-family:Nunito,system-ui,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(700px 500px at 50% 0,rgba(239,190,76,.18),transparent 65%),var(--night)}
.box{width:min(520px,100%);text-align:center;background:linear-gradient(170deg,#1c3050,#111f35);border:1.5px solid rgba(239,190,76,.45);border-radius:28px;padding:34px 24px}
img.c{width:120px;margin:-80px auto 10px;filter:drop-shadow(0 16px 26px rgba(0,0,0,.5));border-radius:12px;animation:in 1s cubic-bezier(.2,1.3,.4,1) both}
@keyframes in{from{transform:rotateY(180deg) scale(.6);opacity:0}}
h1{font-family:"Lilita One",sans-serif;font-weight:400;color:var(--gold);font-size:38px;margin:6px 0 10px}
p{color:var(--muted);margin:0 0 18px}
.code{font:900 clamp(22px,7vw,30px)/1 Nunito,monospace;letter-spacing:.08em;padding:18px 12px;border-radius:16px;background:rgba(0,0,0,.3);border:1.5px dashed var(--gold);margin:0 0 12px;user-select:all}

<div class="box" id="box"><img class="c" src="/img/tresor-face.webp" alt=""><h1 id="h">Vérification…</h1><p id="p">On confirme ton paiement, un instant.</p></div>
<script>
const q=new URLSearchParams(location.search), box=document.getElementById('box');
// Langue : celle du parcours d'achat (?lang=en), sinon le choix gardé sur l'appareil.
let L=q.get('lang'); if(!L){ try{ L=localStorage.getItem('kounouzi_lang'); }catch{} } L= L==='en'?'en':'fr';
if(L==='en'){ try{ localStorage.setItem('kounouzi_lang','en'); }catch{} document.cookie='kz_lang=en; path=/; max-age=31536000; samesite=lax'; q.set('lang','en'); }
const T={fr:{titre:'Merci — Kounouzi',verif:'Vérification…',attente:'On confirme ton paiement, un instant.',merci:'Merci, bienvenue !',ouvert:"Kounouzi est ouvert sur cet appareil. Voici ton code d'accès : garde-le pour ouvrir le jeu sur les autres appareils de la famille.",copier:'Copier le code',jouer:'Jouer à Kounouzi →',astuce:"Astuce : fais une capture d'écran de cette page.",copie:'Code copié ✓',selection:'Sélectionne le code et copie-le',oups:'Oups',introuvable:'Paiement introuvable.',retour:'Retour',accueil:'/#offre',news:'Je souhaite recevoir les nouveautés de Kounouzi (nouvelles questions, offres). Désinscription en un clic.',newsOk:'C\'est noté, merci ! Vous recevrez nos nouveautés.',newsNon:'C\'est noté : vous ne recevrez pas nos nouveautés.',connexion:"Connexion impossible. Recharge la page dans un instant : ton paiement n'est pas perdu."},
 en:{titre:'Thank you — Kounouzi',verif:'Checking…',attente:'We are confirming your payment, one moment.',merci:'Thank you, welcome!',ouvert:'Kounouzi is open on this device. Here is your access code: keep it to open the game on your family\'s other devices.',copier:'Copy the code',jouer:'Play Kounouzi →',astuce:'Tip: take a screenshot of this page.',copie:'Code copied ✓',selection:'Select the code and copy it',oups:'Oops',introuvable:'Payment not found.',retour:'Back',accueil:'/en/#offre',news:'I would like to receive Kounouzi news (new questions, offers). Unsubscribe in one click.',newsOk:'Noted, thank you! You will receive our news.',newsNon:'Noted: you will not receive our news.',connexion:'Cannot connect. Reload the page in a moment: your payment is not lost.'}}[L];
document.documentElement.lang=L; document.title=T.titre; document.getElementById('h').textContent=T.verif; document.getElementById('p').textContent=T.attente;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function go(n=0){
  try{
    const r=await fetch('/api/merci?'+q.toString()); const d=await r.json();
    if(d.ok){
      if(d.achat) try{ gtag('event','purchase',{transaction_id:d.achat.ref,currency:d.achat.devise,value:d.achat.valeur,items:[{item_id:'kounouzi',item_name:'Kounouzi',price:d.achat.valeur,quantity:1}]}); }catch(e){}
      box.innerHTML=`<img class="c" src="/img/tresor-face.webp" alt=""><h1>${T.merci}</h1>
      <p>${T.ouvert}</p>
      <div class="code" id="code">${esc(d.code)}</div>
      <button class="btn ghost" id="copy">${T.copier}</button>
      <a class="btn gold" href="/jouer">${T.jouer}</a>
      <p class="small" style="margin-top:16px">${T.astuce}</p>
      ${q.get('session_id')?`<div class="news"><label><input type="checkbox" id="news"> ${T.news}</label><div class="ok" id="newsMsg" hidden></div></div>`:''}`;
      const nb=document.getElementById('news');
      if(nb) nb.onchange=async()=>{ const m=document.getElementById('newsMsg'); try{ const r=await fetch('/api/news',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_id:q.get('session_id'),news:nb.checked,lang:L})}); if(r.ok){ m.textContent=nb.checked?T.newsOk:T.newsNon; m.hidden=false; } }catch(e){} };
      document.getElementById('copy').onclick=async e=>{ try{ await navigator.clipboard.writeText(d.code); e.target.textContent=T.copie; }catch{ e.target.textContent=T.selection; } };
    } else if(r.status===402 && n<6){ setTimeout(()=>go(n+1),2500); }
    else box.innerHTML=`<h1>${T.oups}</h1><p class="err">${esc(d.erreur||T.introuvable)}</p><a class="btn gold" href="${T.accueil}">${T.retour}</a>`;
  }catch{ if(n<3) setTimeout(()=>go(n+1),2500); else box.innerHTML=`<h1>${T.oups}</h1><p class="err">${T.connexion}</p>`; }
}
go();
</script><script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script>

<script>(function(){ var T={fr:["Nous utilisons des cookies de mesure d'audience (Google Analytics) pour améliorer le site, seulement avec ton accord.","Accepter","Refuser"],en:["We use audience measurement cookies (Google Analytics) to improve the site, only with your consent.","Accept","Decline"]};
  var b=document.getElementById('kzCookies'), L=document.documentElement.lang==='en'?'en':'fr', t=T[L];
  b.lang=L; b.querySelector('span').textContent=t[0]; b.querySelector('[data-c=oui]').textContent=t[1]; b.querySelector('[data-c=non]').textContent=t[2];
  if(kzConsent===null) b.hidden=false;
  b.addEventListener('click',function(e){ var v=e.target.getAttribute('data-c'); if(!v) return; try{ localStorage.setItem('kz_consent',v); }catch(x){}
    if(v==='oui') gtag('consent','update',{analytics_storage:'granted'}); b.remove(); }); })();
/* Mesure d'audience : quelques événements utiles (envoyés seulement selon le consentement choisi). */
(function(){ function ev(n,p){ try{ gtag('event',n,p||{}); }catch(e){} }
  var L=document.documentElement.lang==='en'?'en':'fr';
  document.addEventListener('click',function(e){ var a=e.target&&e.target.closest?e.target.closest('a,button'):null; if(!a) return;
    var h=a.getAttribute('href')||'', s=a.closest('section[id],header,footer,.dock,.gcta'), zone=a.getAttribute('data-zone')||(s?(s.id||s.className||s.tagName).toString().split(' ')[0].toLowerCase():'page');
    if(a.hasAttribute('data-lang')) ev('changement_langue',{langue:a.getAttribute('data-lang'),depuis:L});
    else if(h.indexOf('/api/achat')===0){ var v=window.kzPrix||6.99; ev('begin_checkout',{currency:'EUR',value:v,emplacement:zone,langue:L,items:[{item_id:'kounouzi',item_name:'Kounouzi',price:v,quantity:1}]}); }
    else if(h.indexOf('/jouer')===0) ev('lancement_jeu',{emplacement:zone,langue:L});
    else if(/#offre$/.test(h)||a.hasAttribute('data-cta')) ev('clic_cta',{emplacement:zone,langue:L});
    else if(a.id==='dStart') ev('tutorial_begin',{langue:L});
  },true); })();
/* Lien « Gérer les cookies » : on oublie le choix et le bandeau revient. */
document.querySelectorAll('[data-cookies]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); try{ localStorage.removeItem('kz_consent'); }catch(x){} location.reload(); }); });</script>
