<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1626">
<link rel="icon" href="img/tresor-face.webp">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
</head>
<body>
<title>Kounouzi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout : plateau 3D plein écran, joueurs en haut, action en bas, cartes illustrées par-dessus. Un seul univers : nuit, émeraude, or. */
:root{
  --night:#0c1626; --night-2:#14243b; --emerald:#0f5444; --gold:#efbe4c; --gold-deep:#b9821d;
  --parchment:#f7ecd4; --ink:#2b1f10; --muted:#9fb0c7; --good:#3fae6a; --mid:#e3a33a; --bad:#c9573f;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --arabic:"Noto Naskh Arabic","Geeza Pro","Arial",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:#0c1626}
body{background:var(--night);color:var(--parchment);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#0c1626}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
[dir=rtl],.ar{font-family:var(--arabic)}

/* ---------- Bouton or ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;font-weight:900;font-size:16px;letter-spacing:.01em;transition:transform .12s, filter .12s}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(180deg,#ffd978,var(--gold) 45%,var(--gold-deep));color:#3a2606;box-shadow:0 3px 0 #7d540c,0 8px 20px rgba(239,190,76,.25)}
.btn-ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(239,190,76,.45);color:var(--parchment)}
.btn-good{background:var(--good);color:#fff;box-shadow:0 3px 0 #22693e}
.btn-mid{background:var(--mid);color:#3a2606;box-shadow:0 3px 0 #8d5d12}
.btn-bad{background:#4a5568;color:#fff;box-shadow:0 3px 0 #2b3240}
.btn small{font-weight:800;opacity:.85}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- Écran de préparation ---------- */
#setup{overflow-y:auto;background:radial-gradient(120% 70% at 50% 0%,#1d3557 0%,var(--night) 60%);z-index:20}
.setup-inner{max-width:560px;margin:0 auto;width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
.hero{border-radius:22px;overflow:hidden;aspect-ratio:1/0.62;background:url(img/plateau.webp) center 78%/cover;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 2px rgba(239,190,76,.5);max-width:100%}
.tagline{text-align:center;font-family:var(--display);font-size:22px;color:var(--gold);letter-spacing:.02em;margin:0}
.panel{background:rgba(20,36,59,.85);border:1.5px solid rgba(239,190,76,.25);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--gold);letter-spacing:.02em}
.prow{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(0,0,0,.22)}
.prow .av{position:relative;width:56px;height:56px;border-radius:50%;background:#222 center/cover;border:3px solid var(--c);cursor:pointer;padding:0}
.prow .av .avedit{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#3a2606;font-size:12px;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.avpick{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;border-radius:14px;background:rgba(0,0,0,.25);animation:fade .2s}
.avb{aspect-ratio:1;max-width:100%;border-radius:50%;background:#222 center/cover;border:3px solid rgba(255,255,255,.15);transition:transform .15s}
.avb:active{transform:scale(.94)}
.avb[aria-selected=true]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(239,190,76,.35)}
.prow input[type=text]{width:100%;min-width:0;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:var(--parchment);font:800 16px var(--body);padding:9px 10px}
.prow .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:10px;padding:3px}
.seg button{padding:6px 10px;border-radius:8px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--gold);color:#3a2606}
.prow select{background:rgba(255,255,255,.07);color:var(--parchment);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;padding:7px 8px;font:800 13px var(--body)}
.swatches{display:flex;gap:6px}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid rgba(255,255,255,.25)}
.sw[aria-pressed=true]{outline:3px solid var(--gold);outline-offset:2px}
.sw[disabled]{opacity:.2}
.del{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.07);font-size:18px;color:var(--muted)}
.durations{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.durations button{padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.07);border:1.5px solid transparent;display:flex;flex-direction:column;gap:2px;align-items:center;font-weight:900}
.durations button span{font-size:12px;color:var(--muted);font-weight:700}
.durations button[aria-pressed=true]{border-color:var(--gold);background:rgba(239,190,76,.15)}
.resume{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---------- Écran de jeu ---------- */
#hud{pointer-events:none;z-index:5}
#hud > *{pointer-events:auto}
.top{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-top:8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:grid;grid-template-columns:38px auto;gap:2px 8px;align-items:center;padding:6px 12px 6px 6px;border-radius:16px;background:rgba(12,22,38,.82);border:1.5px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .25s,border-color .25s}
.chip.active{border-color:var(--gold);transform:translateY(2px);box-shadow:0 0 0 3px rgba(239,190,76,.18)}
.chip .av{grid-row:1/3;width:38px;height:38px;border-radius:50%;background:#333 center/cover;border:3px solid var(--c)}
.chip .nm{font-weight:900;font-size:13px;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .mn{font-weight:900;font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:baseline}
.chip .mn small{font-size:11px;color:var(--muted);font-weight:800}
.chip.caisse{grid-template-columns:auto;padding:6px 12px}
.chip.caisse .nm{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.chip.pulse .mn{animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.18)}}
.bottom{margin-top:auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.turnline{display:flex;align-items:center;gap:10px;background:rgba(12,22,38,.82);border:1.5px solid rgba(239,190,76,.3);border-radius:999px;padding:5px 14px 5px 5px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.turnline .av{width:32px;height:32px;border-radius:50%;background:#333 center/cover;border:3px solid var(--c)}
.turnline b{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.02em}
.actions{display:flex;gap:10px;width:100%;max-width:520px;align-items:center}
.actions .main{flex:1;min-height:56px;font-size:18px}
.iconbtn{width:48px;height:48px;border-radius:14px;background:rgba(12,22,38,.82);border:1.5px solid rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:12px;color:var(--muted);letter-spacing:.04em}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(12,22,38,.94);border:1.5px solid var(--gold);border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;z-index:40;max-width:min(90vw,420px);text-align:center;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}}

/* ---------- Lanternes du Chemin ---------- */
#chemin{position:fixed;left:0;right:0;top:32%;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:12;pointer-events:none}
.lanterns{display:flex;gap:10px}
.lantern{width:46px;height:78px;filter:grayscale(.8) brightness(.55);transition:filter .3s, transform .3s}
.lantern.on{filter:none;transform:translateY(-6px)}
.lantern.on svg .glass{fill:#ffcf5a}
.lantern.on svg .halo{opacity:1}
.chemin-text{font-family:var(--display);font-size:30px;color:var(--gold);text-shadow:0 3px 0 #5c3c07,0 0 24px rgba(239,190,76,.6);opacity:0;transition:opacity .3s}
.chemin-text.show{opacity:1}

/* ---------- Bandeau de tour ---------- */
#banner{position:fixed;left:0;right:0;top:38%;display:flex;justify-content:center;z-index:11;pointer-events:none}
#banner .in{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(15,84,68,.96),rgba(9,48,40,.96));border:2px solid var(--gold);border-radius:20px;padding:12px 22px 12px 12px;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:bannerIn .45s cubic-bezier(.2,1.4,.4,1)}
#banner .av{width:58px;height:58px;border-radius:50%;background:#333 center/cover;border:4px solid var(--c)}
#banner small{display:block;color:var(--muted);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
#banner b{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.02em}
@keyframes bannerIn{from{opacity:0;transform:scale(.7)}}

/* ---------- Cartes ---------- */
#overlay{position:fixed;inset:0;z-index:30;background:rgba(5,10,20,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{position:relative;width:min(400px,92vw,calc((100dvh - 230px) * .65));aspect-ratio:.65;max-width:100%;perspective:1400px;flex:0 0 auto}
.card .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,1.25,.5,1)}
.card.tease .flip{animation:tease .7s ease-in-out}
@keyframes tease{0%,100%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.05)}}
.card.hidden-face .flip{transform:rotateY(180deg)}
.card .face,.card .back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4.5% / 3%;background:center/100% 100% no-repeat}
.card .back{transform:rotateY(180deg)}
.win{position:absolute;overflow-y:auto;color:var(--ink);display:flex;flex-direction:column;gap:8px;padding:6px 4px;scrollbar-width:thin;user-select:text;-webkit-user-select:text}
.card.scene .win{top:21%;bottom:30%;left:11%;right:11%}
.card.estab .win{top:33.5%;bottom:9%;left:12%;right:12%}
.win .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.tag{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:rgba(43,31,16,.1);color:#5b4321}
.win h3{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(19px,5.6vw,24px);text-align:center;text-wrap:balance;color:#3b2a12;letter-spacing:.01em}
.qtext{font-weight:800;font-size:clamp(16px,4.6vw,19px);line-height:1.35;text-align:center;text-wrap:balance}
.qtext.ar{font-size:clamp(18px,5vw,21px);line-height:1.6}
.ans{background:rgba(63,174,106,.14);border:1.5px solid rgba(63,174,106,.5);border-radius:12px;padding:8px 10px;font-weight:800;text-align:center}
.ans small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#2f7a4e}
.expl{font-size:14px;line-height:1.45;font-weight:600;background:rgba(43,31,16,.06);border-radius:10px;padding:8px 10px}
.expl .ar{display:block;margin-top:6px;font-size:16px;line-height:1.7}
.src{font-size:11px;color:#7a6440;font-weight:700;text-align:center}
.small{font-size:13px;font-weight:700;text-align:center;color:#5b4321}
.big{font-family:var(--display);font-size:34px;text-align:center;color:#3b2a12}
.timer{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-variant-numeric:tabular-nums;color:#5b4321;font-size:14px}
.timer .bar{flex:1;max-width:140px;height:7px;border-radius:9px;background:rgba(43,31,16,.12);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--gold-deep);transition:width 1s linear}
.timer.alert{color:var(--bad)} .timer.alert .bar i{background:var(--bad)}
.linkbtn{align-self:center;font-weight:900;font-size:13px;color:#7a5512;text-decoration:underline;text-underline-offset:3px;padding:4px 8px}
.langbtn{position:absolute;top:2%;right:3%;width:38px;height:38px;border-radius:50%;background:rgba(12,22,38,.75);color:var(--gold);font:700 16px var(--arabic);z-index:2;border:1.5px solid var(--gold)}
.cacts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(520px,100%)}
.cacts .btn{flex:1 1 140px}
.check{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--parchment);font-weight:800;font-size:14px;width:100%}
.check input{width:22px;height:22px;accent-color:var(--gold)}
.pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pick button{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(43,31,16,.08);border:2px solid rgba(43,31,16,.15);font-weight:900;color:var(--ink)}
.pick button .av{width:30px;height:30px;border-radius:50%;background:#333 center/cover;border:3px solid var(--c)}
.pick button[aria-pressed=true]{border-color:#2f7a4e;background:rgba(63,174,106,.18)}

/* ---------- Pièces ---------- */
.coin{position:fixed;width:22px;height:22px;border-radius:50%;z-index:45;pointer-events:none;background:radial-gradient(circle at 35% 30%,#fff3b8,#f2c24c 45%,#a8730f);box-shadow:0 0 0 2px #7d540c inset,0 2px 6px rgba(0,0,0,.4)}
.floatnum{position:fixed;z-index:46;pointer-events:none;font-family:var(--display);font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.6)}

/* ---------- Menu & fin ---------- */
.sheet{background:var(--night-2);border:1.5px solid rgba(239,190,76,.35);border-radius:20px;padding:16px;width:min(440px,100%);display:flex;flex-direction:column;gap:10px;max-height:85dvh;overflow-y:auto}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;color:var(--gold);font-size:22px}
.sheet p,.sheet li{color:var(--parchment);font-size:14px;line-height:1.5;margin:0}
.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.rank{display:grid;grid-template-columns:30px 44px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(0,0,0,.25)}
.rank.first{background:linear-gradient(90deg,rgba(239,190,76,.25),rgba(0,0,0,.2));border:1.5px solid var(--gold)}
.rank .pos{font-family:var(--display);font-size:24px;color:var(--gold);text-align:center}
.rank .av{width:44px;height:44px;border-radius:50%;background:#333 center/cover;border:3px solid var(--c)}
.rank .nm{font-weight:900;min-width:0}
.rank .sc{font-family:var(--display);font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.stack{grid-column:2/-1;display:flex;height:9px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.08)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:800}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c);vertical-align:-1px}
.dims{grid-column:2/-1;font-size:12px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.setgrp{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:rgba(0,0,0,.22)}
.setgrp h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:900}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800;font-size:14px}
.setrow .seg button{font-size:12px}
.hint{font-size:12px;color:var(--muted);font-weight:700;line-height:1.4}
.hint.ok{color:#8fdcaa}.hint.warn{color:#ffb39e}
.sw2{position:relative;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.15);flex:0 0 auto;transition:background .2s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw2[aria-checked=true]{background:var(--good)}.sw2[aria-checked=true]::after{transform:translateX(18px)}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.chkgrid label{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:800}
.chkgrid input{width:20px;height:20px;accent-color:var(--gold)}
.mic{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:800;font-size:13px;color:var(--parchment)}
.mic i{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
.setup-actions{display:flex;gap:10px}.setup-actions #startBtn{flex:1}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:var(--night);font-family:var(--display);font-size:26px;color:var(--gold)}
.reduce *{animation-duration:.01ms!important;transition-duration:.01ms!important}
</style>

<div id="loading">Kounouzi…</div>
<canvas id="scene" aria-label="Plateau de jeu en 3D"></canvas>

<section id="setup" class="screen" hidden>
  <div class="setup-inner">
    <div class="hero" role="img" aria-label="Illustration Kounouzi"></div>
    <p class="tagline">Joue. Apprends. Gère.</p>
    <div class="panel resume" id="resumeBox" hidden>
      <div><b>Une partie est en cours.</b><div class="clock" id="resumeInfo"></div></div>
      <button class="btn btn-gold" id="resumeBtn">Reprendre</button>
    </div>
    <div class="panel">
      <h2>Les joueurs</h2>
      <div id="plist" style="display:flex;flex-direction:column;gap:10px"></div>
      <button class="btn btn-ghost" id="addP">+ Ajouter un joueur</button>
    </div>
    <div class="panel">
      <h2>Durée de la partie</h2>
      <div class="durations" id="durs"></div>
    </div>
    <div class="setup-actions"><button class="btn btn-ghost" id="setupSettings" style="min-height:60px" aria-label="Réglages">⚙️ Réglages</button><button class="btn btn-gold" id="startBtn" style="min-height:60px;font-size:20px">Commencer la partie</button></div>
  </div>
</section>

<section id="hud" class="screen" hidden>
  <div class="top" id="chips"></div>
  <div class="bottom">
    <div class="turnline" id="turnline"></div>
    <div class="actions">
      <button class="iconbtn" id="viewBtn" aria-label="Zoomer sur le joueur" title="Zoomer sur le joueur">🔍</button>
      <button class="btn btn-gold main" id="mainBtn" disabled>…</button>
      <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
    </div>
    <div class="clock" id="clock"></div>
  </div>
</section>

<div id="chemin" hidden>
  <div class="lanterns" id="lanterns"></div>

/* =========================================================

const TONES=[{id:'pose',lbl:'Posé'},{id:'chaleureux',lbl:'Chaleureux'},{id:'enjoue',lbl:'Enjoué'},{id:'petillant',lbl:'Pétillant'}];

let audioUnlocked=false;
function unlockAudio(){ if(audioUnlocked) return; audioUnlocked=true; try{ audioEl.src=SILENT; audioEl.play().catch(()=>{}); }catch{}
  try{ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);} }catch{} }
async function probeVoice(retry=2){
  try{ const r=await fetch('api/voix?probe',{cache:'no-store'});
    if(r.status===204){ VOICE.mode='cloud'; VOICE.why=''; ['bravo','presque','achat','tresor'].forEach(k=>loadSfx(k)); return; }
    const j=await r.json().catch(()=>null);
    VOICE.why = j&&j.reason==='unconfigured' ? `Voix en ligne non configurée (${(j.missing||[]).join(', ')}).` : 'Voix en ligne indisponible pour l\'instant.';
    if(r.status!==503 && retry>0){ await new Promise(z=>setTimeout(z,1500)); return probeVoice(retry-1); }
  }catch{ VOICE.why='Voix en ligne indisponible ici.'; if(retry>0 && location.protocol==='https:'){ await new Promise(z=>setTimeout(z,1500)); return probeVoice(retry-1); } }
  VOICE.mode = 'speechSynthesis' in window ? 'device' : 'off';
}
function deviceVoice(lang){
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(lang));
  return vs.find(v=>/premium|enhanced|natural|neural|google/i.test(v.name)) || vs.find(v=>/amélie|thomas|audrey|marie|maged|laila/i.test(v.name)) || vs[0] || null;
}
function stopVoice(){ VOICE.token++; try{audioEl.pause();}catch{} try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch{} }
function playDevice(text,lang,tok){
  return new Promise(res=>{ if(!('speechSynthesis' in window)) return res();
    const u=new SpeechSynthesisUtterance(text); u.lang= lang==='ar'?'ar-SA':'fr-FR'; const v=deviceVoice(lang); if(v) u.voice=v;
    u.rate=RATES[SET.rate]||1; u.onend=u.onerror=()=>res(); if(tok!==VOICE.token) return res(); speechSynthesis.speak(u); wait(20000).then(res); });
}
// Les phrases sont téléchargées à l'avance (pendant que le pion avance) et gardées en mémoire :
// au moment de parler, l'audio est déjà là, la voix colle au plateau.
const AUD=new Map();

const AR_WORDS = [
  [/As-salāmu ʿalaykum/gi,'السلام عليكم'],[/Zakat al-Māl/gi,'زكاة المال'],[/Caisse Masākīn/gi,'صندوق المساكين'],[/Masākīn/gi,'المساكين'],
  [/Hassanāt|Hassanat/gi,'حسنات'],[/ʿUmra|Omra/gi,'عمرة'],[/Zakat/gi,'الزكاة'],[/ḥawl/gi,'الحول'],
  [/Maktaba Al-Albānī/gi,'مكتبة الألباني'],[/Maktaba As-Sunnah/gi,'مكتبة السنة'],[/Agence Omra An-Nour|Agence عمرة An-Nour/gi,'وكالة عمرة النور'],[/Agence Omra Al-Hudā|Agence عمرة Al-Hudā/gi,'وكالة عمرة الهدى']];
const toVoice=t=>{ AR_WORDS.forEach(([re,ar])=>{ t=t.replace(re,ar); }); return t; };
const cleanText=t=>toVoice(String(t)).replace(/\s+/g,' ').trim().slice(0,680);
// ElevenLabs limite le nombre de demandes simultanées : jamais plus de 2 à la fois, les phrases urgentes passent devant.
const FQ={active:0, queue:[]};
function runFQ(){ while(FQ.active<2 && FQ.queue.length){ const job=FQ.queue.shift(); FQ.active++; job().finally(()=>{ FQ.active--; runFQ(); }); } }
function queued(fn,urgent){ return new Promise((res,rej)=>{ const job=()=>fn().then(res,rej); if(urgent) FQ.queue.unshift(job); else FQ.queue.push(job); runFQ(); }); }
async function getVoice(url){
  for(let attempt=0; attempt<3; attempt++){
    const r=await fetch(url);
    if(r.ok){ VOICE.err=''; return URL.createObjectURL(await r.blob()); }
    const j=await r.json().catch(()=>({})); VOICE.err = j.detail || (j.status? 'erreur '+j.status : 'erreur '+r.status);
    if(r.status===400) break;
    await new Promise(z=>setTimeout(z, 700*(attempt+1)));
  }
  throw new Error(VOICE.err);
}
function fetchAudio(text,lang,urgent=false){
  const key=lang+'|'+SET.tone+'|'+text;
  if(!AUD.has(key)){
    const url=`api/voix?lang=${lang}&ton=${SET.tone}&text=${encodeURIComponent(text)}`;
    const pr=queued(()=>getVoice(url),urgent).catch(e=>{ AUD.delete(key); throw e; });
    AUD.set(key,pr);
    if(AUD.size>160){ const k=AUD.keys().next().value; AUD.get(k).then(u=>URL.revokeObjectURL(u)).catch(()=>{}); AUD.delete(k); }
  }
  return AUD.get(key);
}
function prefetch(text,lang='fr'){ if(SET.voice && VOICE.mode==='cloud' && text) fetchAudio(cleanText(text),lang).catch(()=>{}); }
function playCloud(text,lang,tok){
  return new Promise(async res=>{ let done=false; const fin=ok=>{ if(done) return; done=true; res(ok); };
    let url; try{ url=await Promise.race([fetchAudio(text,lang,true), new Promise((_,rej)=>setTimeout(()=>rej(new Error('lent')),15000))]); }catch{ return fin(false); }
    if(tok!==VOICE.token) return fin(true);
    audioEl.onended=()=>fin(true); audioEl.onerror=()=>fin(false);
    audioEl.src=url; audioEl.playbackRate=RATES[SET.rate]||1;
    audioEl.play().catch(()=>fin(false)); wait(30000).then(()=>fin(true)); });
}
// Dit une phrase. Par défaut elle coupe la précédente ; {queue:true} la met à la suite.
let voiceChain=Promise.resolve();
function say(text,{lang='fr',queue=false}={}){
  if(!SET.voice || !text || VOICE.mode==='off') return Promise.resolve();
  text=cleanText(text); VOICE.last={text,lang};
  if(!queue){ stopVoice(); voiceChain=Promise.resolve(); }
  const tok=VOICE.token;
  voiceChain = voiceChain.then(async()=>{ if(tok!==VOICE.token) return;
    // Voix ElevenLabs configurée : on ne bascule JAMAIS sur la voix robotique de l'appareil.
    if(VOICE.mode==='cloud'){ await playCloud(text,lang,tok); }
    else await playDevice(text,lang,tok); });
  return voiceChain;
}
// Attendre la fin d'une phrase, sans jamais bloquer le jeu plus de `max` ms.
const sayWait=(text,max=6000,opts)=> Promise.race([say(text,opts), wait(max)]);
const voiceIdle=(max=5000)=> Promise.race([voiceChain, wait(max)]);

async function sfx(k){ if(!SET.voice || !SET.sfx) return; const url=await loadSfx(k); if(!url||paused) return; try{ const a=new Audio(url); a.volume=.55; a.play().catch(()=>{}); }catch{} }

// Les 8 avatars, au choix libre : un enfant peut prendre celui d'un adulte, c'est un jeu.
const AVATARS=['garcon-7-9','fille-7-9','garcon-10-12','fille-10-12','garcon-13-16','fille-13-16','garcon-17-plus','fille-17-plus'];
function avatarFor(p){
  if(p.avatar && AVATARS.includes(p.avatar)) return `img/${p.avatar}-portrait.webp`;
  const g = p.gender==='f'?'fille':'garcon';
  const band = !p.child? '17-plus' : p.age<=9?'7-9': p.age<=12?'10-12': p.age<=16?'13-16':'17-plus';
  return `img/${g}-${band}-portrait.webp`;
}
function startLevel(p){
  if(p.child){ const a=p.age; return a<=6?1: a<=8?2: a<=10?2: a<=12?3: 4; }
  return p.level==='decouverte'?3: p.level==='avance'?4: 4;

function cellXZ(i){ i=((i%N)+N)%N; const h=HALF, D=CELL_D, W=CELL_W, a=h-D/2;

// Caméra : par défaut, vue fixe sur tout le plateau, cadré entre les joueurs (en haut) et les boutons (en bas).
let camMode='overview';

function camPosFor(target,dist,az=0,pol=polar()){ return new THREE.Vector3(target.x+Math.sin(pol)*dist*Math.sin(az), target.y+Math.cos(pol)*dist, target.z+Math.sin(pol)*dist*Math.cos(az)); }
function band(){

  if(!$('#hud').hidden){ const c=$('#chips').getBoundingClientRect(); const b=$('.bottom').getBoundingClientRect(); top=c.bottom+6; bot=b.top-4; }

// Tranches d'âge : un enfant ne reçoit QUE des questions de sa tranche. Un adulte reçoit les tranches les plus hautes.
const AGE_BANDS = { std:['5-6','7-8','9-10','11-12','13+'], rel:['5-8','8-10','10-12','12-14','14+'] };
function bandsFor(p,theme){
  const rel = theme==='religion', a=ageOf(p);
  if(!p.child) return rel? (p.level==='decouverte'? ['12-14','14+'] : ['14+','12-14']) : (p.level==='decouverte'? ['11-12','13+'] : ['13+','11-12']);
  if(rel) return [a<=7?'5-8': a<=9?'8-10': a<=11?'10-12': a<=13?'12-14':'14+'];
  return [a<=6?'5-6': a<=8?'7-8': a<=10?'9-10': a<=12?'11-12':'13+'];
}
// Mathématiques (sans tranche) : difficultés autorisées selon l'âge.
function mathsDiffs(p){ if(!p.child) return p.level==='decouverte'?[3,4]:[4,5]; const a=p.age; return a<=6?[1]: a<=8?[1,2]: a<=10?[2,3]: a<=12?[3,4]:[4,5]; }
// Mémoire des questions déjà vues par chaque joueur, gardée d'une partie à l'autre sur cet appareil.
const SEEN_KEY='kounouzi_v2_seen';
const SEEN = store.get(SEEN_KEY) || {};
const seenOf = p => (SEEN[p.name.toLowerCase()] ||= []);
function poolFor(p,theme){
  if(theme==='maths'){ const ds=mathsDiffs(p); return DATA.questions.filter(q=>q.t==='maths' && ds.includes(q.d)); }
  const bands=bandsFor(p,theme);
  const pool=DATA.questions.filter(q=>q.t===theme && bands.includes(q.a));
  return pool.length? pool : DATA.questions.filter(q=>q.t===theme);
}
function selectQuestion(p, theme){
  const pool=poolFor(p,theme), table=new Set(S.usedQ), seen=seenOf(p), seenSet=new Set(seen);
  // 1) jamais vue par ce joueur et pas encore posée à la table
  let cands=pool.filter(q=>!seenSet.has(q.id) && !table.has(q.id));
  // 2) toutes vues : on recommence le cycle de cette série, en évitant les 15 dernières
  if(!cands.length){ const ids=new Set(pool.map(q=>q.id)); SEEN[p.name.toLowerCase()] = seen.filter(id=>!ids.has(id)); const recent=new Set(seen.slice(-15)); cands=pool.filter(q=>!table.has(q.id)&&!recent.has(q.id)); if(!cands.length) cands=pool; }
  // Le niveau du joueur oriente le tirage (questions proches de son niveau plus probables) sans enfermer dans 5 questions.
  const lvl=p.levels[theme]; const w=cands.map(q=>1/(1+Math.abs(q.d-lvl)*1.5)); let r=Math.random()*w.reduce((x,y)=>x+y,0), i=0; while(r>w[i]){ r-=w[i]; i++; }
  const q=cands[Math.min(i,cands.length-1)];
  S.usedQ.push(q.id); seenOf(p).push(q.id); if(seenOf(p).length>1200) seenOf(p).splice(0,200); store.set(SEEN_KEY,SEEN);
  return q;
}
function nextTheme(p){ const t=THEMES[p.themeIdx%THEMES.length]; p.themeIdx++; return t; }
function levelRange(p,theme){ const ds=poolFor(p,theme).map(q=>q.d); return [Math.min(...ds),Math.max(...ds)]; }
function adapt(p,theme,res){ const [lo,hi]=levelRange(p,theme); p.levels[theme]=Math.min(hi,Math.max(lo,p.levels[theme]));
  if(res==='good'){ p.streak[theme]++; if(p.streak[theme]>=2){ p.levels[theme]=Math.min(5,p.levels[theme]+1); p.streak[theme]=0; } }
  else if(res==='wrong'){ p.levels[theme]=Math.max(1,p.levels[theme]-1); p.streak[theme]=0; }
}
// Pose une question au joueur, la table valide. Retourne 'good' | 'partial' | 'wrong'.

  prefetch(aPhrase(q,curL()),curL());

  timer=setInterval(()=>{ if(revealed||paused) return; left=Math.max(0,left-1); const v=C.win.querySelector('#tmv'), b=C.win.querySelector('#tmb'), t=C.win.querySelector('#tm');
    if(v){ v.textContent= left>0? left+' s' : 'Temps écoulé, tu peux encore répondre'; b.style.width=(left/secs*100)+'%'; t.classList.toggle('alert',left<=10); if(left===10) vibrate(40); }
    if(left===0) clearInterval(timer); },1000);

  clearInterval(timer); const tm=C.win.querySelector('#tm'); if(tm){ tm.classList.remove('alert'); tm.innerHTML='<span style="font-size:22px;letter-spacing:6px">• • •</span>'; } await wait(900);
  revealed=true; clearInterval(timer); draw(); const revealVoice=readQ(); preVerdicts();
  C.acts.innerHTML='';
  const chk=document.createElement('label'); chk.className='check'; chk.innerHTML='<input type="checkbox" id="mastery"> A aussi donné l\'explication (gain ×2)';
  const wrap=document.createElement('div'); wrap.className='cacts';

/* ---------- Validation à la voix : « correct », « presque », « faux » ---------- */
const EAR = {
  correct:["correct","juste","c'est juste","c'est correct","exact","bonne réponse","bravo","gagné","c'est bon","oui"],
  partial:["presque","presque juste","presque bon","à moitié","à peu près","pas tout à fait","partiellement","en partie"],
  wrong:["faux","c'est faux","incorrect","raté","perdu","non","pas juste","pas correct","pas bon","mauvaise réponse"]};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const norm = t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
function verdictOf(phrases){
  let best=null, len=0, tie=false;
  for(const ph of phrases){ const t=' '+norm(ph)+' ';
    for(const [v,list] of Object.entries(EAR)) for(const w of list){ const n=norm(w); if(t.includes(' '+n+' ')){ if(n.length>len){best=v;len=n.length;tie=false;} else if(n.length===len && v!==best) tie=true; } } }
  return tie? null : best;
}
// Ouvre le micro une fois la réponse révélée (et lue). Appuie sur le bouton reconnu. Renvoie une fonction d'arrêt.
function listenVerdict(overlay, acts, afterVoice){
  if(!SET.ecoute || !SR) return ()=>{};
  let stopped=false, rec=null; const tag=document.createElement('div'); tag.className='mic'; tag.innerHTML='<i></i> J\'écoute : dites « correct », « presque » ou « faux »';
  const idx={correct:0,partial:1,wrong:2};
  const start=()=>{ if(stopped) return; try{ rec=new SR(); rec.lang='fr-FR'; rec.maxAlternatives=3; rec.interimResults=false; rec.continuous=false;
      rec.onresult=e=>{ const alts=[...e.results[e.results.length-1]].map(a=>a.transcript); const v=verdictOf(alts);
        if(v){ const b=acts.querySelectorAll('button')[idx[v]]; if(b&&!b.disabled){ stopped=true; b.click(); } } };
      rec.onerror=ev=>{ if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){ stopped=true; tag.innerHTML='Micro refusé : autorise-le dans le navigateur, ou utilise les boutons.'; } };
      rec.onend=()=>{ if(!stopped) setTimeout(start,250); };
      rec.start(); }catch{ stopped=true; } };
  Promise.resolve(afterVoice).then(()=>{ if(!stopped){ overlay.appendChild(tag); start(); } });
  return ()=>{ stopped=true; try{rec&&rec.abort();}catch{} tag.remove(); };
}

function openSettings(fromMenu=false){
  const wasPaused=paused; setPaused(true);
  const ov=document.createElement('div'); ov.id='overlay';
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-k="${key}" data-v="${v}" aria-pressed="${SET[key]===v}">${l}</button>`).join('')}</div>`;
  const sw=(key,lbl)=>`<div class="setrow">${lbl}<button class="sw2" role="switch" data-sw="${key}" aria-checked="${!!SET[key]}" aria-label="${lbl}"></button></div>`;
  const vstate = ()=> VOICE.mode==='cloud'? `<span class="hint ok">Voix Kounouzi en ligne (ElevenLabs) : prénoms et montants sont dits.</span>${VOICE.err?`<br><span class="hint warn">Dernier refus d'ElevenLabs : ${esc(VOICE.err)}</span>`:''}`
    : VOICE.mode==='device'? `<span class="hint warn">Voix de l'appareil en secours. ${esc(VOICE.why)}</span>` : VOICE.mode==='checking'? '<span class="hint">Vérification de la voix…</span>' : '<span class="hint warn">Aucune voix disponible sur cet appareil.</span>';
  function draw(){
    ov.innerHTML=`<div class="sheet"><h2>Réglages</h2>
     <div class="setgrp"><h3>Voix du guide</h3>${sw('voice','Narration vocale')}<div id="vstate">${vstate()}</div>
       <div class="setrow">Ton ${seg('tone',TONES.map(t=>[t.id,t.lbl]))}</div>
       <div class="setrow">Vitesse ${seg('rate',[['lente','Lente'],['normal','Normale'],['rapide','Rapide']])}</div>
       <div class="setrow"><button class="btn btn-ghost" data-a="test">▶ Tester la voix</button><button class="btn btn-ghost" data-a="replay" ${VOICE.last?'':'disabled'}>↺ Réécouter la dernière annonce</button></div></div>
     <div class="setgrp"><h3>Effets de fête</h3>${sw('sfx','Enfants qui applaudissent, confettis')}</div>
     <div class="setgrp"><h3>Validation à la voix</h3>${sw('ecoute','Écouter « correct, presque, faux »')}
       <span class="hint">${SR? 'Une fois la réponse révélée, le micro s\'ouvre : la table dit le verdict au lieu d\'appuyer. Les boutons marchent toujours.' : 'Ce navigateur ne sait pas écouter (Firefox notamment). Essaie Chrome, Edge ou Safari.'}</span></div>
     <div class="setgrp"><h3>Confort</h3>${sw('haptics','Vibration')}
       <div class="setrow">Animations réduites ${seg('reduced',[['system','Comme l\'appareil'],['on','Oui'],['off','Non']])}</div></div>
     <div class="setgrp"><h3>Défis famille (parents)</h3><div class="chkgrid">${DEFIS_GROUPS.map(g=>`<label><input type="checkbox" data-defi="${g.id}" ${SET.defis[g.id]?'checked':''}> ${g.lbl}</label>`).join('')}</div>
       <span class="hint">Une famille décochée ne sera plus proposée sur les cases Défi.</span></div>
     <button class="btn btn-gold" data-a="close">Fermer</button></div>`;
  }
  draw(); document.body.appendChild(ov);
  ov.addEventListener('click',e=>{
    const t=e.target.closest('button,input'); if(!t) return;
    if(t.dataset.sw){ SET[t.dataset.sw]=!SET[t.dataset.sw]; if(t.dataset.sw==='voice'&&!SET.voice) stopVoice(); }
    else if(t.dataset.k){ SET[t.dataset.k]=t.dataset.v; if(t.dataset.k==='reduced') applyReduced(); if(t.dataset.k==='tone') say('Bravo, tu avances bien !'); }
    else if(t.dataset.defi){ SET.defis[t.dataset.defi]=t.checked; saveSet(); return; }
    else if(t.dataset.a==='test'){ unlockAudio(); delete audioEl.dataset.resume; const was=SET.voice; SET.voice=true; say('Bravo, tu avances bien ! Je suis la voix de Kounouzi.'); SET.voice=was; return; }
    else if(t.dataset.a==='replay'){ if(VOICE.last){ const was=SET.voice; SET.voice=true; say(VOICE.last.text,{lang:VOICE.last.lang}); SET.voice=was; } return; }
    else if(t.dataset.a==='close'){ saveSet(); ov.remove(); setPaused(wasPaused && !fromMenu ? true : false); return; }
    else return;
    saveSet(); draw();
  });
}

/* ---------- Défis ---------- */
function nextFamily(p, skip=new Set()){
  const age=ageOf(p); const L=DATA.defis; let tries=0;
  while(tries<L.length*2){
    const d=L[S.famIdx%L.length]; S.famIdx++; tries++;
    if(d.min<=age && defiAllowed(d) && !S.usedFam.includes(d.id) && !skip.has(d.id)){ S.usedFam.push(d.id); return d; }
    if(tries===L.length){ S.usedFam=[]; }
  }
  return L.find(d=>d.min<=ageOf(p)&&defiAllowed(d)) || L[0];
}
function variantFor(d,age){ return d.v.find(v=>age>=v.ageMin && (v.ageMax===undefined||age<v.ageMax)) || (d.v.length? d.v[d.v.length-1]:null); }
async function onFamily(p){
  const skip=new Set();
  while(true){
    const d=nextFamily(p,skip); const age=ageOf(p); const v=variantFor(d,age);
    const C=openCard({face:'defi',back:'defi'});
    C.win.innerHTML=`<div class="meta"><span class="tag">Défi famille</span><span class="tag">${esc(d.cl)}</span>${d.boss?'<span class="tag">Grand défi</span>':''}</div>
      <h3>${esc(d.ti)}</h3><div class="qtext">${esc(d.tx)}</div>${v?`<div class="ans"><small>Pour ${esc(p.name)}</small>${esc(v.text)}</div>`:''}
      ${d.consent?'<div class="small">Chaque personne concernée doit être d\'accord.</div>':''}
      <div class="small">${d.rw>0?`Réussi : +${famReward(d)} K`:'Un choix t\'attend si tu réussis.'} · Raté ou refusé : rien de perdu.</div>`;
    say(`${d.oh?'Oh non ! ':''}${d.ti}. ${d.tx}${v?' Pour toi : '+v.text+'.':''}`);
    const opts=[{label:'Réussi !',cls:'btn-good',value:'ok'},{label:'Pas cette fois',cls:'btn-bad',value:'no'}];
    if(d.consent) opts.push({label:'Quelqu\'un refuse : autre défi',cls:'btn-ghost',value:'swap'});
    const r=await choose(C.acts,opts);
    if(r==='swap'){ C.close(); skip.add(d.id); await wait(250); continue; }
    if(r==='no'){ C.close(); say(`Pas grave, ${p.name}. L'important, c'est d'avoir essayé.`); return; }
    // Réussi : effets particuliers puis récompense
    const others=S.players.filter(q=>q!==p);
    for(const ef of (d.on||[])){
      if(ef.kind==='transfer_choice'){ C.win.innerHTML=`<h3>${esc(d.ti)}</h3>`; const t=await pickPlayer(C.win,C.acts,others,`À qui donnes-tu ${ef.amount} K ?`); await pay(p,t,ef.amount); }
      else if(ef.kind==='give_to_poorest'){ const t=[...others].sort((a,b)=>a.money-b.money||a.seat-b.seat)[0]; await pay(p,t,ef.amount); }
      else if(ef.kind==='choice'){ C.win.innerHTML=`<h3>${esc(d.ti)}</h3><div class="small">Que choisis-tu ?</div>`;
        const ch=await choose(C.acts,[{label:'Garder 10 K',cls:'btn-ghost',value:'keep'},{label:'Donner 5 K à deux joueurs, gagner 25 K',value:'share'}]);
        if(ch==='keep') await pay('bank',p,10);
        else { for(let k=0;k<2;k++){ C.win.innerHTML=`<h3>${esc(d.ti)}</h3>`; const t=await pickPlayer(C.win,C.acts,others,`Joueur ${k+1} sur 2 : qui reçoit 5 K ?`); await pay(p,t,5); } await pay('bank',p,25); } }
    }
    C.close(); fxParty(); sfx('bravo'); say(`Défi réussi, bravo ${p.name} !${d.rw>0?' Tu gagnes '+famReward(d)+' Kounouz.':''}`); if(d.rw>0){ vibrate([30,40,30]); await pay('bank',p,famReward(d)); }
    return;
  }
}

// Ce que la voix annonce en arrivant sur une case. Même texte au préchargement et au moment de parler.
function cellIntro(p,i){
  const c=CELLS[i];
  if(c.type==='question'){ const t=p._pre? p._pre.theme : THEMES[p.themeIdx%THEMES.length]; return `Case Savoir ! Une question ${deTheme(t)}.`; }
  if(c.type==='challenge'){ const k=CHAL_ROT[S.chalIdx%CHAL_ROT.length];
    if(k==='family') return `Case Défi ! C'est un défi famille pour ${p.name}.`;
    if(k==='hassanat') return `Case Défi ! Une occasion Hassanāt pour ${p.name}.`;
    if(k==='duel') return `Case Défi ! C'est un Duel ! ${p.name}, choisis ton adversaire.`;
    const t=p._pre? p._pre.theme : THEMES[p.themeIdx%THEMES.length]; return `Case Défi ! Une question ${deTheme(t)}.`; }
  if(c.type==='heritage') return heritageText(p,i);
  if(c.type==='treasure') return `Case Trésor ! Tu remportes ${ECO.treasure} Kounouz. Bien joué !`;
  if(c.type==='halt') return `Case Halte. ${p.name}, ton voyage s'interrompt ici. Au prochain tour, une question pour repartir.`;
  if(c.type==='donation') return p.money>=ECO.donation? `Case Don. ${p.name}, choisis à qui donner ${ECO.donation} Kounouz. Donner rapporte ${ECO.donationHassanat} Hassanāt.` : `Case Don. Il te faut ${ECO.donation} Kounouz pour donner : cette fois, rien ne se passe.`;
  if(c.type==='hassanat') return `Case Hassanāt ! Une occasion de générosité pour ${p.name}.`;
  return 'Case Départ.';
}

async function movePawn(p, steps){

  const path=[]; for(let k=1;k<=steps;k++) path.push((p.pos+k)%N);
  for(const i of path) glow(i,.25);

    const a=m.position.clone(); const v=cellXZ(i); if(CELLS[i].type==='heritage') v.addScaledVector(inward(i),.16); v.y=TOP_Y;
    await tween(400,k=>{ m.position.lerpVectors(a,v,k); m.position.y=TOP_Y+Math.sin(Math.PI*k)*.42; m.userData.shadow.position.y=-(m.position.y-TOP_Y)+.003; m.userData.shadow.scale.setScalar(1-Math.sin(Math.PI*k)*.4); },easeIO);
    glow(i,0); p.pos=i; vibrate(8);
    if(!REDUCED){ const b=m.userData.body; tween(160,k=>{ const q=Math.sin(Math.PI*k)*.18; b.forEach(o=>{o.scale.set(1+q*.6,1-q,1+q*.6);}); }); }
    if(i===0 && path.length){ passed=true; }
  }
  following=false; await settlePawns(); fxRing(p.pos, p.hex); fxBurst(p.pos, '#ffe08a', 22); await moveCam(450);
  if(passed){ toast(`Passage par le Départ : +${ECO.startPass} K`); await Promise.all([sayWait(`Tu repasses par le départ. Beau tour complet ! Plus ${ECO.startPass} Kounouz.`,5000), pay('bank',p,ECO.startPass)]); }
}
async function resolveCell(p){
  const c=CELLS[p.pos]; glow(p.pos,.6);
  const label = CELL_LABEL[c.type] + (c.type==='question'&&p._pre? ' · '+THEME_INFO[p._pre.theme].fr : c.type==='heritage'? ' · '+c.nom : '');
  toast(label,1800);
  // Savoir et Défi : la voix annonce la case avant d'ouvrir la carte.
  if(c.type==='question'||c.type==='challenge'||c.type==='hassanat') await Promise.all([sayWait(cellIntro(p,p.pos),5000), wait(1100)]); else await wait(900);
  glow(p.pos,0);
  if(c.type==='heritage') return onHeritage(p,p.pos);
  if(c.type==='question') return askQuestion(p);
  if(c.type==='challenge') return onChallenge(p);
  if(c.type==='treasure') return onTreasure(p);
  if(c.type==='halt') return onHalt(p);
  if(c.type==='donation') return onDonation(p);
  if(c.type==='hassanat') return onHassanat(p);
}
async function playTurn(){
  if(S.over) return showEnd();
  save(); renderHUD(); highlightActive(); $('#chip'+S.turn)?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  const p=cur(); camMode= camMode==='overview'?'overview':'follow';
  if(!S.lastRoundSaid && S.duration && (store.get(ELAPSED)||0)>=S.duration && S.turn===0){ S.lastRoundSaid=true; say('Dernier tour de table ! Donnez tout ce que vous avez.'); await wait(2500); }
  const turnText=PH.turn(p.name);
  await Promise.all([moveCam(700), banner(p), sayWait(turnText,4500,{queue:true})]);
  if(p.halted){
    toast('Halte : question de reprise'); await wait(400);
    const r=await askQuestion(p,{title:'Question de reprise',intro:`${p.name}, une question pour quitter la Halte.`}); p.halted=false;
    if(r!=='wrong') await sayWait(`Tu reprends la route, ${p.name} !`,3500);
    if(r==='wrong'){ camFocus=false; say('Tu repartiras au prochain tour.'); toast(`${p.name} reste à la Halte ce tour-ci. Il repartira au prochain.`,3000); await wait(1200); return endTurn(); }
  }
  // Préchargement pendant que le joueur appuie : phrase du Chemin, annonce de la case d'arrivée, question.
  const steps=peekSteps(p), land=(p.pos+steps)%N, journeyText=PH.journey(p.name,steps);
  const lc=CELLS[land], ck=CHAL_ROT[S.chalIdx%CHAL_ROT.length];
  if(lc.type==='question' || (lc.type==='challenge' && ck==='question')){ const t=nextTheme(p); p._pre={theme:t, q:selectQuestion(p,t)}; }
  prefetch(journeyText); prefetch(cellIntro(p,land)); if(p._pre) prefetch(qPhrase(p._pre.q,'fr'));
  if(steps+p.pos>=N) prefetch(`Tu repasses par le départ. Beau tour complet ! Plus ${ECO.startPass} Kounouz.`);
  await waitMain('Découvrir mon chemin');
  const n=assignSteps(p); await Promise.all([revealChemin(n), sayWait(journeyText,5000)]);
  idleMain('En route…'); await movePawn(p,n);
  await resolveCell(p);
  camFocus=false; moveCam(900);
  await voiceIdle(5000); await wait(250); endTurn();
}
async function endTurn(){
  idleMain(); S.turn++;
  if(S.turn>=S.players.length){ S.turn=0; await endRound(); S.round++; if(S.over) { save(); return showEnd(); } }
  prefetch(PH.turn(cur().name)); playTurn();
}
async function endRound(){
  // Zakat al-Māl : 6 tours de table de suite au-dessus du nissab (1 000 K) → 2,5 % à la Caisse Masākīn.
  for(const p of S.players){
    if(p.money>=1000) p.zakat++; else p.zakat=0;
    if(p.zakat>=6){ const amt=Math.round(p.money*0.025); p.zakat=0;
      say(`Une année s'achève pour ${p.name}. C'est le moment de la Zakat.`); await simpleCard('don',`<h3>Zakat al-Māl</h3><div class="small">${esc(p.name)} a gardé plus de 1 000 K pendant 6 tours de table : un ḥawl est passé.</div><div class="big">${amt} K</div><div class="small">2,5 % versés à la Caisse Masākīn.</div>`,'Verser');
      say(`${p.name} verse sa Zakat : ${amt} Kounouz. Bravo !`); await pay(p,'caisse',amt); }
  }
  const elapsed=store.get(ELAPSED)||0;
  if(S.endRequested || (S.duration && elapsed>=S.duration)) S.over=true;
}

/* =========================================================
   Horloge de partie (temps de jeu réel)
   ========================================================= */
let lastTick=performance.now();
setInterval(()=>{
  const now=performance.now(); const dt=now-lastTick; lastTick=now;
  if(!S||S.over||paused||document.hidden||$('#hud').hidden) return;
  const e=(store.get(ELAPSED)||0)+dt; store.set(ELAPSED,e); clockText(e);
},1000);
function clockText(e){ const el=$('#clock');
  if(!S.duration){ el.textContent=`Partie libre · ${Math.floor(e/60000)} min · tour de table ${S.round}`; return; }
  const left=Math.max(0,S.duration-e); el.textContent = left>0? `Il reste ${Math.ceil(left/60000)} min · tour de table ${S.round}${paused?' · en pause':''}` : `Dernier tour de table · ${S.round}`; }

/* =========================================================
   Menu, fin de partie
   ========================================================= */
$('#viewBtn').onclick=()=>{ camMode = camMode==='follow'?'overview':'follow'; $('#viewBtn').textContent= camMode==='follow'?'🔭':'🔍'; moveCam(700); };
// L'application passe en arrière-plan (appel, autre appli) : pause automatique, reprise au retour.
let autoPaused=false;
document.addEventListener('visibilitychange',()=>{ if(!S) return;
  if(document.hidden){ if(!paused){ autoPaused=true; setPaused(true); } }
  else if(autoPaused){ autoPaused=false; setPaused(false); } });
function setPaused(v){
  if(v===paused) return;
  if(v){ paused=true; pausedAt=performance.now();
    try{ if(audioEl.src && !audioEl.paused){ audioEl.pause(); audioEl.dataset.resume='1'; } }catch{}
    try{ if('speechSynthesis' in window && speechSynthesis.speaking) speechSynthesis.pause(); }catch{}
  } else { const d=performance.now()-pausedAt; anims.forEach(a=>a.t0+=d); paused=false;
    try{ if(audioEl.dataset.resume){ delete audioEl.dataset.resume; audioEl.play().catch(()=>{}); } }catch{}
    try{ if('speechSynthesis' in window) speechSynthesis.resume(); }catch{}
  }
  if(S) clockText(store.get(ELAPSED)||0);
}
$('#menuBtn').onclick=()=>{
  setPaused(true);
  const ov=document.createElement('div'); ov.id='overlay';
  ov.innerHTML=`<div class="sheet"><h2>Pause</h2>
   <p>Le temps de jeu est arrêté tant que ce menu est ouvert.</p>
   <ul><li>Le Chemin donne 1 à 5 cases, sans hasard : tout le monde avance autant au total.</li>
   <li>Bonne réponse +${ECO.qGood} K, en partie +${ECO.qPartial} K, ×2 si l'explication est donnée.</li>
   <li>Établissement : achat à son prix, chaque visite rapporte 15 % du prix au propriétaire.</li>
   <li>Zakat al-Māl : 6 tours de table de suite au-dessus de 1 000 K, et 2,5 % vont à la Caisse Masākīn. ${S.players.map(p=>`${esc(p.name)} ${p.zakat}/6`).join(' · ')}</li>
   <li>Score final = Kounouz + patrimoine + Hassanāt × 5.</li></ul>
   <button class="btn btn-gold" data-a="close">Reprendre la partie</button>
   <button class="btn btn-ghost" data-a="settings">⚙️ Réglages (voix, défis, confort)</button>
   <button class="btn btn-ghost" data-a="end">${S.endRequested?'Fin demandée à la fin du tour de table':'Terminer à la fin de ce tour de table'}</button>
   <button class="btn btn-ghost" data-a="new">Nouvelle partie…</button></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{ const a=e.target.closest('[data-a]')?.dataset.a; if(!a) return;
    if(a==='close'){ ov.remove(); setPaused(false); }
    if(a==='settings'){ ov.remove(); openSettings(true); }
    if(a==='end'){ S.endRequested=true; store.set(SAVE,{...store.get(SAVE),endRequested:true}); ov.remove(); setPaused(false); toast('La partie s\'arrêtera à la fin de ce tour de table.'); }
    if(a==='new'){ const s=ov.querySelector('.sheet'); s.innerHTML=`<h2>Nouvelle partie ?</h2><p>La partie en cours sera perdue.</p><button class="btn btn-gold" data-a="confirm">Oui, recommencer</button><button class="btn btn-ghost" data-a="close">Non, continuer</button>`; }
    if(a==='confirm'){ store.del(SAVE); location.reload(); }
  };
};
function showEnd(){
  idleMain('Partie terminée'); camMode='overview'; moveCam(900);
  const ranked=[...S.players].sort((a,b)=>scoreOf(b)-scoreOf(a)||b.money-a.money||a.seat-b.seat);
  const max=Math.max(...ranked.map(scoreOf),1);
  say(`La partie est terminée. Bravo à tous, et félicitations ${ranked[0].name} !`);
  const ov=document.createElement('div'); ov.id='overlay';
  ov.innerHTML=`<div class="sheet"><h2>Classement final</h2>
   <div class="legend"><span style="--c:#efbe4c">Kounouz</span><span style="--c:#3fae6a">Patrimoine</span><span style="--c:#7cc4ff">Hassanāt × 5</span></div>
   ${ranked.map((p,k)=>{const h=heritageOf(p),hz=p.hassanat*5; return `<div class="rank ${k===0?'first':''}" style="--c:${p.hex}"><div class="pos">${k+1}</div><div class="av" style="background-image:url(${avatarFor(p)})"></div><div class="nm">${esc(p.name)}</div><div class="sc">${fmt(scoreOf(p))}</div>
     <div class="stack"><i style="width:${p.money/max*100}%;background:#efbe4c"></i><i style="width:${h/max*100}%;background:#3fae6a"></i><i style="width:${hz/max*100}%;background:#7cc4ff"></i></div>
     <div class="dims">${fmt(p.money)} K · patrimoine ${fmt(h)} · ✦ ${p.hassanat}</div></div>`}).join('')}
   <p>Caisse Masākīn : ${fmt(S.caisse)} K versés pendant la partie.</p>
   <button class="btn btn-gold" id="again">Nouvelle partie</button></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#again').onclick=()=>{ store.del(SAVE); location.reload(); };
}

/* =========================================================
   Préparation
   ========================================================= */
let defs = store.get(PLAYERS) || [
  {name:'Yacine',gender:'m',child:true,age:10,level:'standard',color:'bleu'},
  {name:'Maryam',gender:'f',child:true,age:8,level:'standard',color:'violet'},
  {name:'Papa',gender:'m',child:false,age:10,level:'standard',color:'vert'}];
let dur = 'classique';
function renderSetup(){
  const used=defs.map(d=>d.color);
  $('#plist').innerHTML = defs.map((d,i)=>{ const hex=COLORS.find(c=>c.id===d.color).hex; return `<div class="prow" style="--c:${hex}">
    <button class="av" data-i="${i}" data-a="pickav" style="background-image:url(${avatarFor(d)})" aria-label="Choisir l'avatar de ${esc(d.name)}" aria-expanded="${!!d._pick}"><span class="avedit">✎</span></button>
    <input type="text" id="pname${i}" data-i="${i}" value="${esc(d.name)}" maxlength="14" aria-label="Prénom du joueur ${i+1}">
    ${defs.length>2?`<button class="del" data-i="${i}" data-a="del" aria-label="Retirer">✕</button>`:'<span></span>'}
    <div class="opts">
      <div class="seg"><button data-i="${i}" data-a="child" aria-pressed="${d.child}">Enfant</button><button data-i="${i}" data-a="adult" aria-pressed="${!d.child}">Adulte</button></div>
      ${d.child? `<select id="page${i}" data-i="${i}" aria-label="Âge">${Array.from({length:12},(_,k)=>k+5).map(a=>`<option value="${a}" ${a===d.age?'selected':''}>${a} ans</option>`).join('')}</select>`
        : `<select id="plvl${i}" data-i="${i}" aria-label="Niveau">${[['decouverte','Découverte'],['standard','Standard'],['avance','Avancé']].map(([v,l])=>`<option value="${v}" ${v===d.level?'selected':''}>${l}</option>`).join('')}</select>`}
      <div class="swatches">${COLORS.map(c=>`<button class="sw" style="--c:${c.hex}" data-i="${i}" data-a="color" data-c="${c.id}" aria-label="${c.name}" aria-pressed="${d.color===c.id}" ${used.includes(c.id)&&d.color!==c.id?'disabled':''}></button>`).join('')}</div>
    </div>
    ${d._pick? `<div class="avpick" role="listbox" aria-label="Avatars">${AVATARS.map(a=>`<button class="avb" role="option" data-i="${i}" data-a="setav" data-av="${a}" aria-selected="${avatarFor(d)===`img/${a}-portrait.webp`}" style="background-image:url(img/${a}-portrait.webp)" aria-label="Avatar ${a.replace(/-/g,' ')}"></button>`).join('')}</div>`:''}
    </div>`; }).join('');
  $('#addP').hidden = defs.length>=6;
  $('#durs').innerHTML = DURATIONS.map(x=>`<button data-d="${x.id}" aria-pressed="${dur===x.id}">${x.lbl}<span>${x.min?x.min+' min':'sans limite'}</span></button>`).join('');
}
$('#plist').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const i=+b.dataset.i, d=defs[i];
  if(b.dataset.a==='pickav'){ const open=!d._pick; defs.forEach(x=>delete x._pick); if(open) d._pick=true; }
  if(b.dataset.a==='setav'){ d.avatar=b.dataset.av; d.gender= b.dataset.av.startsWith('fille')?'f':'m'; delete d._pick; }
  if(b.dataset.a==='child') d.child=true; if(b.dataset.a==='adult') d.child=false;
  if(b.dataset.a==='color') d.color=b.dataset.c;
  if(b.dataset.a==='del') defs.splice(i,1);
  renderSetup(); });
$('#plist').addEventListener('input',e=>{ const i=+e.target.dataset.i; if(e.target.type==='text') defs[i].name=e.target.value; });
$('#plist').addEventListener('change',e=>{ const i=+e.target.dataset.i; if(e.target.id.startsWith('page')) defs[i].age=+e.target.value; if(e.target.id.startsWith('plvl')) defs[i].level=e.target.value; renderSetup(); });
$('#addP').onclick=()=>{ const free=COLORS.find(c=>!defs.some(d=>d.color===c.id)); defs.push({name:'Joueur '+(defs.length+1),gender:'m',child:true,age:9,level:'standard',color:free.id}); renderSetup(); };
$('#durs').onclick=e=>{ const b=e.target.closest('[data-d]'); if(b){ dur=b.dataset.d; renderSetup(); } };
$('#startBtn').onclick=()=>{
  defs.forEach((d,i)=>{ d.name=(d.name||'').trim()||('Joueur '+(i+1)); });
  defs.forEach(x=>delete x._pick); store.set(PLAYERS,defs);
  newGame(defs.map(d=>({...d, hex:COLORS.find(c=>c.id===d.color).hex})), DURATIONS.find(x=>x.id===dur).min);
  enterGame(true);
};
$('#resumeBtn').onclick=()=>{ S=store.get(SAVE); enterGame(); };
function enterGame(fresh){
  unlockAudio();
  $('#setup').hidden=true; $('#hud').hidden=false;
  try{ navigator.wakeLock?.request('screen').catch(()=>{}); }catch{}
  buildPawns(); rebuildBuildings(); renderHUD(); resize(); clockText(store.get(ELAPSED)||0);
  const intro = introCam();
  // Nouvelle partie : l'accueil est dit en entier avant le premier tour.
  const hello = fresh? sayWait(PH.start(namesList(S.players.map(p=>p.name))),16000) : Promise.resolve();
  if(fresh) prefetch(PH.turn(cur().name));
  Promise.all([hello,intro]).then(()=>playTurn());
}

// Accès de diagnostic (lecture de l'état depuis la console)
window.__kounouzi={get state(){return S}};
// Démarrage
const saved=store.get(SAVE);
if(saved && saved.v===2 && !saved.over){ $('#resumeBox').hidden=false; $('#resumeInfo').textContent=`${saved.players.map(p=>p.name).join(', ')} · tour de table ${saved.round}`; }
renderSetup(); resize(); probeVoice();
$('#loading').remove(); $('#setup').hidden=false;
</script>
