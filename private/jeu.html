<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1626">
<link rel="icon" type="image/png" sizes="32x32" href="/img/logo/favicon-32.png"><link rel="icon" type="image/png" sizes="48x48" href="/img/logo/favicon-48.png"><link rel="icon" type="image/png" sizes="192x192" href="/img/logo/favicon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kounouzi">

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
</head>
<body>
<title>Kounouzi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout : plateau 3D plein écran, joueurs en haut, action en bas, cartes illustrées par-dessus. Un seul univers : nuit, émeraude, or. */
:root{
  --night:#0c1626; --night-2:#14243b; --emerald:#0f5444; --gold:#efbe4c; --gold-deep:#b9821d;
  --parchment:#f7ecd4; --ink:#2b1f10; --muted:#9fb0c7; --good:#3fae6a; --mid:#e3a33a; --bad:#c9573f;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --arabic:"Noto Naskh Arabic","Geeza Pro","Arial",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:#0c1626}
body{background:var(--night);color:var(--parchment);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#0c1626}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
[dir=rtl],.ar{font-family:var(--arabic)}

/* ---------- Bouton or ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;font-weight:900;font-size:16px;letter-spacing:.01em;transition:transform .12s, filter .12s}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(180deg,#ffd978,var(--gold) 45%,var(--gold-deep));color:#3a2606;box-shadow:0 3px 0 #7d540c,0 8px 20px rgba(239,190,76,.25)}
.btn-ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(239,190,76,.45);color:var(--parchment)}
.btn-good{background:var(--good);color:#fff;box-shadow:0 3px 0 #22693e}
.btn-mid{background:var(--mid);color:#3a2606;box-shadow:0 3px 0 #8d5d12}
.btn-bad{background:#4a5568;color:#fff;box-shadow:0 3px 0 #2b3240}
.btn small{font-weight:800;opacity:.85}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- Écran de préparation ---------- */
#setup{overflow-y:auto;background:radial-gradient(120% 70% at 50% 0%,#1d3557 0%,var(--night) 60%);z-index:20}
.setup-inner{box-sizing:border-box;max-width:560px;margin:0 auto;width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
.hero{border-radius:22px;overflow:hidden;aspect-ratio:1/0.62;background:url(img/plateau.webp) center 78%/cover;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 2px rgba(239,190,76,.5);max-width:100%}
.seg button img.flag{width:20px;height:14px;border-radius:3px;vertical-align:-2px;margin-inline-end:6px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.langrow{display:flex;justify-content:center;gap:8px;align-items:center}.langnote{font-size:12px;color:var(--muted);font-weight:700;text-align:center;margin:0}.qfr{font-size:11px;font-weight:800;color:#ffd978;opacity:.9}
.tagline{text-align:center;font-family:var(--display);font-size:22px;color:var(--gold);letter-spacing:.02em;margin:0}
.panel{background:rgba(20,36,59,.85);border:1.5px solid rgba(239,190,76,.25);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--gold);letter-spacing:.02em}
.prow{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(0,0,0,.22)}
.prow .av{position:relative;width:56px;height:56px;border-radius:50%;background:#222 center/cover;border:3px solid var(--c);cursor:pointer;padding:0}
.prow .av .avedit{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#3a2606;font-size:12px;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.avpick{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;border-radius:14px;background:rgba(0,0,0,.25);animation:fade .2s}
.avb{aspect-ratio:1;max-width:100%;border-radius:50%;background:#222 center/cover;border:3px solid rgba(255,255,255,.15);transition:transform .15s}
.avb:active{transform:scale(.94)}
.avb[aria-selected=true]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(239,190,76,.35)}
.prow input[type=text]{width:100%;min-width:0;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:var(--parchment);font:800 16px var(--body);padding:9px 10px}
.prow .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:10px;padding:3px}
.seg button{padding:6px 10px;border-radius:8px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--gold);color:#3a2606}
.prow select{background:rgba(255,255,255,.07);color:var(--parchment);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;padding:7px 8px;font:800 13px var(--body)}
.swatches{display:flex;gap:6px}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid rgba(255,255,255,.25)}
.sw[aria-pressed=true]{outline:3px solid var(--gold);outline-offset:2px}
.sw[disabled]{opacity:.2}
.del{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.07);font-size:18px;color:var(--muted)}
.durations{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.durations button{padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.07);border:1.5px solid transparent;display:flex;flex-direction:column;gap:2px;align-items:center;font-weight:900}
.durations button span{font-size:12px;color:var(--muted);font-weight:700}
.durations button[aria-pressed=true]{border-color:var(--gold);background:rgba(239,190,76,.15)}
.resume{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---------- Écran de jeu ---------- */
#hud{pointer-events:none;z-index:5}
#hud > *{pointer-events:auto}
.top{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-top:8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:grid;grid-template-columns:38px auto;gap:2px 8px;align-items:center;padding:6px 12px 6px 6px;border-radius:16px;background:rgba(12,22,38,.82);border:1.5px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .25s,border-color .25s}
.chip.active{border-color:var(--gold);transform:translateY(2px);box-shadow:0 0 0 3px rgba(239,190,76,.18)}
.chip .av{grid-row:1/3;width:38px;height:38px;border-radius:50%;background:#333 center/cover;border:3px solid var(--c)}
.chip .nm{font-weight:900;font-size:13px;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .mn{font-weight:900;font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:baseline}
.chip .mn small{font-size:11px;color:var(--muted);font-weight:800}
.chip.caisse{grid-template-columns:auto;padding:6px 12px}
.chip.caisse .nm{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.chip.pulse .mn{animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.18)}}
.bottom{margin-top:auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.turnline{display:flex;align-items:center;gap:10px;background:rgba(12,22,38,.82);border:1.5px solid rgba(239,190,76,.3);border-radius:999px;padding:5px 14px 5px 5px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.turnline .av{width:32px;height:32px;border-radius:50%;background:#333 center/cover;border:3px solid var(--c)}
.turnline b{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.02em}
.turnline .tl{display:flex;flex-direction:column}
.turnline .st{display:none}
/* Téléphone en hauteur : la carte du joueur prend la place libre, comme dans une appli */
@media (max-aspect-ratio:62/100){
  .turnline{box-sizing:border-box;width:min(100%,520px);border-radius:22px;padding:10px 16px 10px 10px;gap:14px;background:linear-gradient(135deg,rgba(28,48,80,.92),rgba(12,22,38,.92));border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 24px color-mix(in srgb,var(--c) 22%,transparent)}
  .turnline .av{width:54px;height:54px;border-width:3px}
  .turnline b{font-size:21px}
  .turnline .st{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;font-weight:800;font-size:13.5px;color:var(--muted)}
  .turnline .st i{font-style:normal;white-space:nowrap}
  .bottom{gap:12px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
  .actions .main{min-height:62px;font-size:19px;border-radius:20px}
  .iconbtn{width:56px;height:56px;border-radius:18px}
}
.actions{display:flex;gap:10px;width:100%;max-width:520px;align-items:center}
.actions .main{flex:1;min-height:56px;font-size:18px}
.iconbtn{width:48px;height:48px;border-radius:14px;background:rgba(12,22,38,.82);border:1.5px solid rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:12px;color:var(--muted);letter-spacing:.04em}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(12,22,38,.94);border:1.5px solid var(--gold);border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;z-index:40;max-width:min(90vw,420px);text-align:center;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}}

/* ---------- Lanternes du Chemin ---------- */
#chemin{position:fixed;left:0;right:0;top:32%;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:12;pointer-events:none}
.lanterns{display:flex;gap:10px}
.lantern{width:46px;height:78px;filter:grayscale(.8) brightness(.55);transition:filter .3s, transform .3s}
.lantern.on{filter:none;transform:translateY(-6px)}
.lantern.on svg .glass{fill:#ffcf5a}
.lantern.on svg .halo{opacity:1}
.chemin-text{font-family:var(--display);font-size:30px;color:var(--gold);text-shadow:0 3px 0 #5c3c07,0 0 24px rgba(239,190,76,.6);opacity:0;transition:opacity .3s}
.chemin-text.show{opacity:1}

/* ---------- Bandeau de tour ---------- */
#banner{position:fixed;left:0;right:0;top:38%;display:flex;justify-content:center;z-index:11;pointer-events:none}
#banner .in{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(15,84,68,.96),rgba(9,48,40,.96));border:2px solid var(--gold);border-radius:20px;padding:12px 22px 12px 12px;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:bannerIn .45s cubic-bezier(.2,1.4,.4,1)}
#banner .av{width:58px;height:58px;border-radius:50%;background:#333 center/cover;border:4px solid var(--c)}
#banner small{display:block;color:var(--muted);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
#banner b{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.02em}
@keyframes bannerIn{from{opacity:0;transform:scale(.7)}}

/* ---------- Cartes ---------- */
#overlay{position:fixed;inset:0;z-index:30;background:rgba(5,10,20,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{position:relative;width:min(400px,92vw,calc((100dvh - 230px) * .6667));aspect-ratio:2/3;max-width:100%;perspective:1600px;flex:0 0 auto}
.card .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.3,1.4,.45,1)}
.card.hidden-face .flip{transform:rotateY(180deg)}
.card .face,.card .back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8% / 5.4%;background:center/100% 100% no-repeat;overflow:hidden}
.card .back{transform:rotateY(180deg)}
/* Ouverture : la carte arrive en tournoyant depuis le plateau, se retourne dans un éclat de lumière, puis un reflet la traverse. */
.card.enter{animation:cardIn .8s cubic-bezier(.2,1.25,.4,1) both}
@keyframes cardIn{0%{transform:translateY(60vh) scale(.2) rotate(-32deg);opacity:0}45%{opacity:1}100%{transform:none}}
.card::before{content:"";position:absolute;inset:-25%;border-radius:50%;background:radial-gradient(circle,rgba(255,225,140,.7),rgba(255,140,220,.25) 40%,transparent 65%);opacity:0;pointer-events:none}
.card.burst::before{animation:burst 1.1s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.5)}25%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
.card .face::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 46%,transparent 62%);transform:translateX(-130%);pointer-events:none}
.card.shine .face::after{animation:glint 1.1s ease-out}
@keyframes glint{to{transform:translateX(130%)}}
.card.leave{animation:cardOut .38s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes cardOut{to{transform:translateY(40px) scale(.55) rotate(12deg);opacity:0}}
.win{position:absolute;overflow-y:auto;color:var(--ink);display:flex;flex-direction:column;gap:8px;padding:6px 4px;scrollbar-width:thin;user-select:text;-webkit-user-select:text}
.card .win{top:38.8%;bottom:11.8%;left:9.4%;right:9.4%;z-index:1}
.win .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.tag{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:rgba(43,31,16,.1);color:#5b4321}
.win h3{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(19px,5.6vw,24px);text-align:center;text-wrap:balance;color:#3b2a12;letter-spacing:.01em}
.qtext{font-weight:800;font-size:clamp(16px,4.6vw,19px);line-height:1.35;text-align:center;text-wrap:balance}
.qtext.ar{font-size:clamp(18px,5vw,21px);line-height:1.6}
.ans{background:rgba(63,174,106,.14);border:1.5px solid rgba(63,174,106,.5);border-radius:12px;padding:8px 10px;font-weight:800;text-align:center}
.ans small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#2f7a4e}
.expl{font-size:14px;line-height:1.45;font-weight:600;background:rgba(43,31,16,.06);border-radius:10px;padding:8px 10px}
.expl .ar{display:block;margin-top:6px;font-size:16px;line-height:1.7}
.src{font-size:11px;color:#7a6440;font-weight:700;text-align:center}
.small{font-size:13px;font-weight:700;text-align:center;color:#5b4321}
.big{font-family:var(--display);font-size:34px;text-align:center;color:#3b2a12}
.timer{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-variant-numeric:tabular-nums;color:#5b4321;font-size:14px}
.timer .bar{flex:1;max-width:140px;height:7px;border-radius:9px;background:rgba(43,31,16,.12);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--gold-deep);transition:width 1s linear}
.timer.alert{color:var(--bad)} .timer.alert .bar i{background:var(--bad)}
.linkbtn{align-self:center;font-weight:900;font-size:13px;color:#7a5512;text-decoration:underline;text-underline-offset:3px;padding:4px 8px}
.langbtn{position:absolute;top:5%;right:7%;width:38px;height:38px;border-radius:50%;background:rgba(12,22,38,.75);color:var(--gold);font:700 16px var(--arabic);z-index:2;border:1.5px solid var(--gold)}
.cacts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(520px,100%)}
.cacts .btn{flex:1 1 140px}
.check{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--parchment);font-weight:800;font-size:14px;width:100%}
.check input{width:22px;height:22px;accent-color:var(--gold)}
.pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pick button{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(43,31,16,.08);border:2px solid rgba(43,31,16,.15);font-weight:900;color:var(--ink)}
.pick button .av{width:30px;height:30px;border-radius:50%;background:#333 center/cover;border:3px solid var(--c)}
.pick button[aria-pressed=true]{border-color:#2f7a4e;background:rgba(63,174,106,.18)}

/* ---------- Pièces ---------- */
.coin{position:fixed;width:22px;height:22px;border-radius:50%;z-index:45;pointer-events:none;background:radial-gradient(circle at 35% 30%,#fff3b8,#f2c24c 45%,#a8730f);box-shadow:0 0 0 2px #7d540c inset,0 2px 6px rgba(0,0,0,.4)}
.floatnum{position:fixed;z-index:46;pointer-events:none;font-family:var(--display);font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.6)}

/* ---------- Menu & fin ---------- */
.sheet{background:var(--night-2);border:1.5px solid rgba(239,190,76,.35);border-radius:20px;padding:16px;width:min(440px,100%);display:flex;flex-direction:column;gap:10px;max-height:85dvh;overflow-y:auto}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;color:var(--gold);font-size:22px}
.sheet p,.sheet li{color:var(--parchment);font-size:14px;line-height:1.5;margin:0}
.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.rank{display:grid;grid-template-columns:30px 44px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(0,0,0,.25)}
.rank.first{background:linear-gradient(90deg,rgba(239,190,76,.25),rgba(0,0,0,.2));border:1.5px solid var(--gold)}
.rank .pos{font-family:var(--display);font-size:24px;color:var(--gold);text-align:center}
.rank .av{width:44px;height:44px;border-radius:50%;background:#333 center/cover;border:3px solid var(--c)}
.rank .nm{font-weight:900;min-width:0}
.rank .sc{font-family:var(--display);font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.stack{grid-column:2/-1;display:flex;height:9px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.08)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:800}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c);vertical-align:-1px}
.dims{grid-column:2/-1;font-size:12px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.setgrp{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:rgba(0,0,0,.22)}
.setgrp h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:900}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800;font-size:14px}
.setrow .seg button{font-size:12px}
.hint{font-size:12px;color:var(--muted);font-weight:700;line-height:1.4}

applyReduced();

   ========================================================= */
const TONES=['pose','chaleureux','enjoue','petillant'];
const RATES={lente:.9,normal:1,rapide:1.15};
const VOICE={mode:'checking', why:'', last:null, token:0};
const audioEl = new Audio(); audioEl.preload='auto';
const SILENT='data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//WreyTRUoAWgBgkOAGbZHBgG1OF6zM82DWbZaUmMBptgQhGjsyYqc9ae9XFz280948NMBWInljyzsNRFLPWdnZGWrddDsjK1unuSrVN9jJsK8KuQtQCtMBjCEtImISdNKJOopIpBFpNSMbIHCSRpRR5iakjTiyzLhchUUBwCgyKiweBv/7UsQbg8isVNoMPMjAAAA0gAAABEVFGmgqK////9bP/6XCykxBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq';
let audioUnlocked=false;
function unlockAudio(){ if(audioUnlocked) return; audioUnlocked=true; try{ audioEl.src=SILENT; audioEl.play().catch(()=>{}); }catch{}
  try{ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);} }catch{} }
async function probeVoice(retry=2){
  try{ const r=await fetch('api/voix?probe',{cache:'no-store'});
    if(r.status===204){ VOICE.mode='cloud'; VOICE.why=''; ['bravo','presque','achat','tresor'].forEach(k=>loadSfx(k)); return; }
    const j=await r.json().catch(()=>null);
    VOICE.why = j&&j.reason==='unconfigured' ? t('voix.nonConfig',{m:(j.missing||[]).join(', ')}) : t('voix.indispo');
    if(r.status!==503 && retry>0){ await new Promise(z=>setTimeout(z,1500)); return probeVoice(retry-1); }
  }catch{ VOICE.why=t('voix.indispoIci'); if(retry>0 && location.protocol==='https:'){ await new Promise(z=>setTimeout(z,1500)); return probeVoice(retry-1); } }

}
function deviceVoice(lang){
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(lang));
  return vs.find(v=>/premium|enhanced|natural|neural|google/i.test(v.name)) || vs.find(v=>/amélie|thomas|audrey|marie|maged|laila|daniel|serena|kate|samantha/i.test(v.name)) || vs[0] || null;
}
function stopVoice(){ VOICE.token++; try{audioEl.pause();}catch{} try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch{} }
function playDevice(text,lang,tok){
  return new Promise(res=>{ if(!('speechSynthesis' in window)) return res();
    const u=new SpeechSynthesisUtterance(text); u.lang= lang==='ar'?'ar-SA': localeDe(lang); const v=deviceVoice(lang); if(v) u.voice=v;
    u.rate=RATES[SET.rate]||1; u.onend=u.onerror=()=>res(); if(tok!==VOICE.token) return res(); speechSynthesis.speak(u); wait(20000).then(res); });
}
// Les phrases sont téléchargées à l'avance (pendant que le pion avance) et gardées en mémoire :
// au moment de parler, l'audio est déjà là, la voix colle au plateau.
const AUD=new Map();
// La voix lit les mots arabes en arabe : on les écrit en lettres arabes avec les harakat (voyelles) pour une prononciation juste dans le texte parlé (l'écran garde le français).
const AR_WORDS = [
  [/Masākīn Fund/gi,'صُنْدُوقُ الْمَسَاكِين'],[/As-salāmu ʿalaykum/gi,'السَّلَامُ عَلَيْكُم'],[/Zakat al-Māl/gi,'زَكَاةُ الْمَال'],[/Caisse Masākīn/gi,'صُنْدُوقُ الْمَسَاكِين'],[/Masākīn/gi,'الْمَسَاكِين'],
  [/Hassanāt|Hassanat/gi,'حَسَنَات'],[/ʿUmra|Omra/gi,'عُمْرَة'],[/Zakat/gi,'الزَّكَاة'],[/ḥawl/gi,'الْحَوْل'],
  [/Maktaba Al-Albānī/gi,'مَكْتَبَةُ الْأَلْبَانِي'],[/Maktaba As-Sunnah/gi,'مَكْتَبَةُ السُّنَّة'],[/Agence Omra An-Nour|Agence عمرة An-Nour/gi,'وَكَالَةُ عُمْرَةِ النُّور'],[/Agence Omra Al-Hudā|Agence عمرة Al-Hudā/gi,'وَكَالَةُ عُمْرَةِ الْهُدَى'],[/Hôtel At-Tawḥīd/gi,'فُنْدُقُ التَّوْحِيد'],[/Hôtel Al-Iḥsān/gi,'فُنْدُقُ الْإِحْسَان'],[/Hôtel Al-Sharif/gi,'فُنْدُقُ الشَّرِيف'],[/Hôtel El Kunuz/gi,'فُنْدُقُ الْكُنُوز'],
  [/Umrah|ʿUmrah/gi,'عُمْرَة'],[/An-Nour عمرة Agency/gi,'وَكَالَةُ عُمْرَةِ النُّور'],[/Al-Hudā عمرة Agency/gi,'وَكَالَةُ عُمْرَةِ الْهُدَى'],
  [/Hotel At-Tawḥīd/gi,'فُنْدُقُ التَّوْحِيد'],[/Hotel Al-Iḥsān/gi,'فُنْدُقُ الْإِحْسَان'],[/Hotel Al-Sharif/gi,'فُنْدُقُ الشَّرِيف'],[/Hotel El Kunuz/gi,'فُنْدُقُ الْكُنُوز']];

const echapRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const PRONON=(Array.isArray(RG.prononciation)?RG.prononciation:[]).filter(p=>p&&p.e&&p.d)
  .sort((a,b)=>b.e.length-a.e.length).map(p=>[new RegExp('(^|[^\\p{L}\\p{M}])('+echapRe(p.e)+')(?=$|[^\\p{L}\\p{M}])','giu'),p.d]);

// ElevenLabs limite le nombre de demandes simultanées : jamais plus de 2 à la fois, les phrases urgentes passent devant.
const FQ={active:0, queue:[]};
function runFQ(){ while(FQ.active<2 && FQ.queue.length){ const job=FQ.queue.shift(); FQ.active++; job().finally(()=>{ FQ.active--; runFQ(); }); } }

async function getVoice(url){
  for(let attempt=0; attempt<3; attempt++){
    const r=await fetch(url);
    if(r.ok){ VOICE.err=''; return URL.createObjectURL(await r.blob()); }
    const j=await r.json().catch(()=>({})); VOICE.err = j.detail || (j.status? 'erreur '+j.status : 'erreur '+r.status);
    if(r.status===400) break;
    await new Promise(z=>setTimeout(z, 700*(attempt+1)));
  }
  throw new Error(VOICE.err);
}
function fetchAudio(text,lang,urgent=false){
  const key=lang+'|'+SET.tone+'|'+text;
  if(!AUD.has(key)){
    const url=`api/voix?lang=${lang}&ton=${SET.tone}&text=${encodeURIComponent(text)}`;
    const pr=queued(()=>getVoice(url),urgent).catch(e=>{ AUD.delete(key); throw e; });
    AUD.set(key,pr);
    if(AUD.size>160){ const k=AUD.keys().next().value; AUD.get(k).then(u=>URL.revokeObjectURL(u)).catch(()=>{}); AUD.delete(k); }
  }

}
function prefetch(text,lang=LANG){ if(SET.voice && VOICE.mode==='cloud' && text) fetchAudio(cleanText(text),lang).catch(()=>{}); }
function playCloud(text,lang,tok){
  return new Promise(async res=>{ let done=false; const fin=ok=>{ if(done) return; done=true; res(ok); };
    let url; try{ url=await Promise.race([fetchAudio(text,lang,true), new Promise((_,rej)=>setTimeout(()=>rej(new Error('lent')),15000))]); }catch{ return fin(false); }
    if(tok!==VOICE.token) return fin(true);
    audioEl.onended=()=>fin(true); audioEl.onerror=()=>fin(false);
    audioEl.src=url; audioEl.playbackRate=RATES[SET.rate]||1;

// Dit une phrase. Par défaut elle coupe la précédente ; {queue:true} la met à la suite.

    if(VOICE.mode==='cloud'){ await playCloud(text,lang,tok); }
    else await playDevice(text,lang,tok); });

const pick = arr=>arr[Math.floor(Math.random()*arr.length)];

// Phrases du guide : le texte dépend de la langue choisie au moment où il est dit.
const PH = {

// Caméra : par défaut, vue fixe sur tout le plateau, cadré entre les joueurs (en haut) et les boutons (en bas).
let camMode='overview';
let camFocus=false;   // la caméra accompagne le pion pendant son déplacement, puis revient sur tout le plateau
let sway=0;           // léger balancement permanent : le plateau « respire »
const camState={target:new THREE.Vector3(), dist:14, az:0, pol:0};
let overviewDist=14, viewDy=0;
const polar = ()=> camera.aspect<.62 ? 0.34 : camera.aspect<.9 ? 0.46 : 0.68; // téléphone : presque vu du dessus, le plateau remplit l'écran
function camPosFor(target,dist,az=0,pol=polar()){ return new THREE.Vector3(target.x+Math.sin(pol)*dist*Math.sin(az), target.y+Math.cos(pol)*dist, target.z+Math.sin(pol)*dist*Math.cos(az)); }
function band(){
  const h=innerHeight; let top=8, bot=h-8;
  if(!$('#hud').hidden){ const c=$('#chips').getBoundingClientRect(); const b=$('.bottom').getBoundingClientRect(); top=c.bottom+6; bot=b.top-4; }
  return {top:1-2*top/h, bot:1-2*bot/h};
}
function fitOverview(){
  const pts=[]; for(const x of[-4.4,4.4]) for(const z of[-4.4,4.4]) for(const y of[-.3,.32]) pts.push(new THREE.Vector3(x,y,z));
  const tgt=new THREE.Vector3(0,0,0); const B=band(); const bandH=B.top-B.bot;
  camera.clearViewOffset();
  let best=40, cy=0;
  for(let d=5; d<60; d+=.1){ camera.position.copy(camPosFor(tgt,d)); camera.lookAt(tgt); camera.updateMatrixWorld();
    let minX=9,maxX=-9,minY=9,maxY=-9; pts.forEach(v=>{const q=v.clone().project(camera); minX=Math.min(minX,q.x);maxX=Math.max(maxX,q.x);minY=Math.min(minY,q.y);maxY=Math.max(maxY,q.y);});
    // Marge sur les côtés : rien ne passe sous les coins arrondis de l'écran, même quand la caméra se balance.
    if(maxX-minX<=(camera.aspect<.9?1.9:1.82) && maxY-minY<=bandH*.95){ best=d; cy=(minY+maxY)/2; break; } }
  viewDy = ((B.top+B.bot)/2 - cy) * innerHeight/2;
  return best;
}
function applyCam(){ camera.position.copy(camPosFor(camState.target,camState.dist,camState.az+sway,polar()+camState.pol)); camera.lookAt(camState.target);
  camera.setViewOffset(innerWidth,innerHeight,0,viewDy,innerWidth,innerHeight); dirty=true; }
function camGoal(){
  if(!S || (camMode==='overview' && !camFocus)) return {t:new THREE.Vector3(0,0,0), d:overviewDist, az:0, pol:0};
  const p=pawns[S.turn]?.position || new THREE.Vector3();
  const f = camMode==='follow'? .6 : .35, d = camMode==='follow'? .6 : .82;

let camTweenId=0;
const easeOut = t=>1-Math.pow(1-t,3);
function moveCam(dur=750, ease=easeIO){
  const id=++camTweenId; const g=camGoal(); const t0=camState.target.clone(), d0=camState.dist, a0=camState.az, p0=camState.pol;
  return tween(dur,k=>{ if(id!==camTweenId) return; camState.target.lerpVectors(t0,g.t,k); camState.dist=d0+(g.d-d0)*k; camState.az=a0+(g.az-a0)*k; camState.pol=p0+(g.pol-p0)*k; applyCam(); },ease);
}
function followSoft(){ if(camMode!=='follow' && !camFocus) return; const g=camGoal(); camState.target.lerp(g.t,.07); camState.dist+= (g.d-camState.dist)*.07; camState.az+=(g.az-camState.az)*.07; camState.pol+=(g.pol-camState.pol)*.07; applyCam(); }

function fxBurst(i,col='#ffd36a',n=26){ if(REDUCED) return; const v=cellXZ(i); const pos=new Float32Array(n*3), vel=[];
  for(let k=0;k<n;k++){ pos[k*3]=v.x; pos[k*3+1]=TOP_Y+.1; pos[k*3+2]=v.z; const a=Math.random()*Math.PI*2, r=.6+Math.random()*1.2; vel.push([Math.cos(a)*r,1.6+Math.random()*1.6,Math.sin(a)*r]); }

  const pts=new THREE.Points(g,new THREE.PointsMaterial({size:.12,color:col,map:radialTex('rgba(255,255,255,1)','rgba(255,255,255,0)',64),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));

let lastFrame=0;
function loop(now){
  if(paused){ requestAnimationFrame(loop); return; }
  for(let i=anims.length-1;i>=0;i--){ const a=anims[i]; const k=Math.min(1,(now-a.t0)/a.dur); a.fn(a.ease(k)); if(k>=1){anims.splice(i,1);a.res();} }
  if(following) followSoft();
  const busy = anims.length||dirty||following;
  // Au repos : 30 images par seconde suffisent pour le balancement et les poussières (économie de batterie).
  if(busy || (!REDUCED && now-lastFrame>33)){
    if(!REDUCED){
      sway=Math.sin(now*.00016)*.05;
      for(let k=0;k<DUST_N;k++){ dustPos[k*3+1]+=dustSpd[k]*.016; dustPos[k*3]+=Math.sin(now*.0004+k)*.0015; if(dustPos[k*3+1]>4) dustPos[k*3+1]=0; }
      dustGeo.attributes.position.needsUpdate=true;
      if(S && pawns[S.turn]){ const pp=pawns[S.turn].position; activeRing.visible=true; activeRing.position.set(pp.x,TOP_Y+.012,pp.z); const s=1+Math.sin(now*.005)*.12; activeRing.scale.setScalar(s); activeRing.material.opacity=.55+Math.sin(now*.005)*.3; activeRing.material.color.set(S.players[S.turn].hex); }
      else activeRing.visible=false;

function fxParty(big=true){
  if(REDUCED || !SET.sfx) return;
  const cv=document.createElement('canvas'); cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:44;pointer-events:none';
  const W=cv.width=innerWidth*Math.min(devicePixelRatio,2), H=cv.height=innerHeight*Math.min(devicePixelRatio,2); document.body.appendChild(cv);
  const g=cv.getContext('2d'), k=W/innerWidth, cols=['#ffd36a','#ff5c7a','#3aa8ff','#3ddc84','#b45cff','#ff8a3a','#ffffff'];
  const conf=Array.from({length:big?140:60},()=>({x:Math.random()*W,y:-Math.random()*H*.5,vx:(Math.random()-.5)*3*k,vy:(2+Math.random()*3)*k,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:(6+Math.random()*6)*k,h:(10+Math.random()*8)*k,c:pick(cols)}));
  const ball=big? Array.from({length:9},(_,i)=>({x:(0.08+i*0.105)*W+(Math.random()-.5)*30*k,y:H+Math.random()*H*.3,vy:-(2.4+Math.random()*1.6)*k,sw:Math.random()*6.28,r:(22+Math.random()*10)*k,c:pick(cols.slice(0,6))})):[];
  const glit=Array.from({length:big?60:25},()=>({x:Math.random()*W,y:Math.random()*H*.7,t:Math.random()*60}));
  let f=0; const T=big?190:110;
  (function frame(){ f++; g.clearRect(0,0,W,H); const fade=f>T-40? (T-f)/40 : 1; g.globalAlpha=Math.max(0,fade);
    for(const b of ball){ b.y+=b.vy; b.sw+=.04; const x=b.x+Math.sin(b.sw)*14*k;
      g.strokeStyle='rgba(255,255,255,.6)'; g.lineWidth=1.5*k; g.beginPath(); g.moveTo(x,b.y+b.r*1.15); g.quadraticCurveTo(x+8*k,b.y+b.r*2,x,b.y+b.r*3); g.stroke();
      const gr=g.createRadialGradient(x-b.r*.35,b.y-b.r*.4,b.r*.1,x,b.y,b.r*1.1); gr.addColorStop(0,'#fff'); gr.addColorStop(.25,b.c); gr.addColorStop(1,b.c);
      g.fillStyle=gr; g.beginPath(); g.ellipse(x,b.y,b.r*.88,b.r*1.05,0,0,6.28); g.fill(); }
    for(const c of conf){ c.x+=c.vx; c.y+=c.vy; c.r+=c.vr; c.vx*=.995; g.save(); g.translate(c.x,c.y); g.rotate(c.r); g.fillStyle=c.c; g.fillRect(-c.w/2,-c.h/2,c.w,c.h*Math.abs(Math.cos(c.r*2))); g.restore(); }
    for(const s of glit){ s.t++; const a=Math.abs(Math.sin(s.t*.15)); g.fillStyle=`rgba(255,230,150,${a})`; const r=(1.5+a*2.5)*k; g.beginPath(); g.moveTo(s.x,s.y-r*2); g.lineTo(s.x+r*.5,s.y); g.lineTo(s.x,s.y+r*2); g.lineTo(s.x-r*.5,s.y); g.fill(); g.beginPath(); g.moveTo(s.x-r*2,s.y); g.lineTo(s.x,s.y+r*.5); g.lineTo(s.x+r*2,s.y); g.lineTo(s.x,s.y-r*.5); g.fill(); }
    if(f<T) requestAnimationFrame(frame); else cv.remove(); })();
}

function selectQuestion(p, theme){
  const pool=poolFor(p,theme), table=new Set(S.usedQ), seen=seenOf(p), seenSet=new Set(seen);
  if(!pool.length) return null;   // aucune question adaptée : l'appelant choisit un autre thème
  // 1) jamais vue par ce joueur et pas encore posée à la table
  let cands=pool.filter(q=>!seenSet.has(q.id) && !table.has(q.id));
  // Poids 0 = question mise de côté ; « prioritaire » = posée avant les autres tant qu'elle n'a pas été vue.
  const usable=cands.filter(q=>(q.w??1)>0); if(usable.length) cands=usable;
  const prio=cands.filter(q=>q.prio); if(prio.length) cands=prio;
  // 2) toutes vues : on recommence le cycle de cette série, en évitant les 15 dernières
  if(!cands.length){ const ids=new Set(pool.map(q=>q.id)); SEEN[p.name.toLowerCase()] = seen.filter(id=>!ids.has(id)); const recent=new Set(RG.eviter===0?[]:seen.slice(-(RG.eviter||15))); cands=pool.filter(q=>!table.has(q.id)&&!recent.has(q.id)); if(!cands.length) cands=pool; }
  // Le niveau du joueur oriente le tirage (questions proches de son niveau plus probables) sans enfermer dans 5 questions.
  if(p.levels[theme]===undefined){ p.levels[theme]=startLevel(p); p.streak[theme]=0; }
  const lvl=p.levels[theme]; const w=cands.map(q=>(q.w??1)/(1+Math.abs(q.d-lvl)*1.5)+1e-9); let r=Math.random()*w.reduce((x,y)=>x+y,0), i=0; while(r>w[i]){ r-=w[i]; i++; }
  const q=cands[Math.min(i,cands.length-1)];
  S.usedQ.push(q.id); seenOf(p).push(q.id); if(seenOf(p).length>1200) seenOf(p).splice(0,200); store.set(SEEN_KEY,SEEN);
  return q;
}
// Thème suivant du joueur ; un thème sans aucune question adaptée à son âge est sauté (jamais de question inadaptée).
function nextTheme(p){
  for(let k=0;k<THEMES.length;k++){ const t=THEMES[p.themeIdx%THEMES.length]; p.themeIdx++; if(poolFor(p,t).length) return t; }
  const t=THEMES[p.themeIdx%THEMES.length]; p.themeIdx++; return t;   // aucun thème n'a de question adaptée (cas extrême)
}
function levelRange(p,theme){ const ds=poolFor(p,theme).map(q=>q.d); return ds.length? [Math.min(...ds),Math.max(...ds)] : [1,5]; }
function adapt(p,theme,res){ if(p.streak[theme]===undefined) p.streak[theme]=0; if(p.levels[theme]===undefined) p.levels[theme]=startLevel(p); const [lo,hi]=levelRange(p,theme); p.levels[theme]=Math.min(hi,Math.max(lo,p.levels[theme]));
  if(res==='good'){ p.streak[theme]++; if(p.streak[theme]>=2){ p.levels[theme]=Math.min(5,p.levels[theme]+1); p.streak[theme]=0; } }
  else if(res==='wrong'){ p.levels[theme]=Math.max(1,p.levels[theme]-1); p.streak[theme]=0; }
}
// Pose une question au joueur, la table valide. Retourne 'good' | 'partial' | 'wrong'.
async function askQuestion(p, {theme, title, intro}={}){
  let q;
  if(!theme && p._pre){ ({theme,q}=p._pre); p._pre=null; }
  theme = theme || nextTheme(p);
  q = q || selectQuestion(p,theme);
  // Thème imposé (ex. duel) sans question adaptée à ce joueur : on prend son prochain thème adapté.
  if(!q){ theme=nextTheme(p); q=selectQuestion(p,theme); }
  if(!q){ toast(t('q.aucune',{n:p.name}),3000); return 'skip'; }
  const ti=THEME_INFO[theme];
  const C=openCard({face:ti.card, back:ti.card});
  // Langue de la carte : celle du jeu si la question est traduite, sinon le français (signalé).
  // Le bouton arabe n'existe que pour la Religion (question, réponse ou explication en arabe).
  const L0 = LANG!=='fr' && q.q[LANG] && q.r[LANG] ? LANG : 'fr';
  let lang=L0; const religion = theme==='religion';
  const hasArQ = religion && !!q.q.ar, hasArAny = religion && !!(q.q.ar||q.r.ar||q.e.ar);
  const secs = p.child?(RG.minuteur?.enfant||60):(RG.minuteur?.adulte||45); let left=secs, timer=null, revealed=false;
  function draw(){
    const LQ = lang==='ar'&&q.q.ar? 'ar' : L0, LR = lang==='ar'&&q.r.ar? 'ar' : L0;
    const LE = q.e[L0]? L0 : 'fr';   // explication : langue du jeu si traduite, sinon français
    C.win.innerHTML = `<div class="meta"><span class="tag">${title?esc(title):themeNom(theme)}</span><span class="tag">${t('q.niveau',{d:q.d})}</span><span class="tag">${esc(p.name)}</span>${L0!==LANG?`<span class="tag qfr">${t('q.enFrancais')}</span>`:''}</div>
      <div class="qtext ${LQ==='ar'?'ar':''}" dir="${LQ==='ar'?'rtl':'ltr'}" lang="${LQ}">${esc(q.q[LQ])}</div>
      ${revealed? `<div class="ans" dir="${LR==='ar'?'rtl':'ltr'}" lang="${LR}"><small>${t('q.reponse')}</small>${esc(q.r[LR])}</div>
        ${q.e.fr||(religion&&q.e.ar)? `<button class="linkbtn" id="explBtn">${t('q.voirExpl')}</button><div class="expl" id="expl" hidden><span lang="${LE}">${esc(q.e[LE]||'')}</span>${religion&&q.e.ar?`<span class="ar" dir="rtl" lang="ar">${esc(q.e.ar)}</span>`:''}</div>`:''}
        ${q.s?`<div class="src">${esc(q.s)}</div>`:''}`
      : `<div class="timer" id="tm"><span id="tmv">${t('q.secondes',{n:left})}</span><span class="bar"><i id="tmb" style="width:${left/secs*100}%"></i></span></div>`}`;
    const eb=C.win.querySelector('#explBtn'); if(eb) eb.onclick=()=>{ C.win.querySelector('#expl').hidden=false; eb.remove();
      if(lang==='ar'&&religion&&q.e.ar) return say(q.e.ar,{lang:'ar'});
      if(q.e[LE]) say(q.e[LE],{lang:LE}); if(religion&&q.e.ar) say(q.e.ar,{lang:'ar',queue:true}); };
    syncAr();
  }
  // Bouton arabe (Religion uniquement) : avant la réponse, seulement si la question existe en arabe ;
  // après la réponse, dès qu'il y a de l'arabe (question, réponse ou explication).
  let lb=null;
  function syncAr(){
    const show = revealed? hasArAny : hasArQ;
    if(show && !lb){ lb=document.createElement('button'); lb.className='langbtn';
      lb.onclick=()=>{ lang= lang==='ar'? L0 : 'ar'; draw();
        if(lang==='ar' && revealed && !q.q.ar && !q.r.ar && q.e.ar){ const x=C.win.querySelector('#explBtn'); if(x) x.click(); else say(q.e.ar,{lang:'ar'}); }
        else readQ(); };
      C.face.appendChild(lb); }
    if(lb){ lb.hidden=!show; lb.textContent= lang==='ar'? t('q.retourLangue',{}) : 'ع'; lb.setAttribute('aria-label',t('q.arabe')); }
  }
  const qL=()=> lang==='ar'&&q.q.ar? 'ar' : L0, rL=()=> lang==='ar'&&q.r.ar? 'ar' : L0;
  const readQ=()=>{ if(!revealed){ const L=qL(); return say(qPhrase(q,L),{lang:L}); } const L=rL(); return say(aPhrase(q,L),{lang:L}); };
  prefetch(aPhrase(q,rL()),rL());
  const preVerdicts=()=>{ prefetch(PH.good(p.name)+gainText('good',1)); };
  draw(); if(intro) await sayWait(intro,5000); readQ();
  timer=setInterval(()=>{ if(revealed||paused) return; left=Math.max(0,left-1); const v=C.win.querySelector('#tmv'), b=C.win.querySelector('#tmb'), tm=C.win.querySelector('#tm');
    if(v){ v.textContent= left>0? t('q.secondes',{n:left}) : t('q.tempsEcoule'); b.style.width=(left/secs*100)+'%'; tm.classList.toggle('alert',left<=10); if(left===10) vibrate(40); }
    if(left===0) clearInterval(timer); },1000);
  await choose(C.acts,[{label:t('q.voirReponse'),value:1}]);
  clearInterval(timer); const tm=C.win.querySelector('#tm'); if(tm){ tm.classList.remove('alert'); tm.innerHTML='<span style="font-size:22px;letter-spacing:6px">• • •</span>'; } await wait(900);
  revealed=true; clearInterval(timer); draw(); const revealVoice=readQ(); preVerdicts();
  C.acts.innerHTML='';
  const chk=document.createElement('label'); chk.className='check'; chk.innerHTML='<input type="checkbox" id="mastery"> '+esc(t('q.maitrise'));
  const wrap=document.createElement('div'); wrap.className='cacts';
  C.el.appendChild(chk); C.el.appendChild(wrap);
  C.acts.remove(); C.acts=wrap;
  const verdict = choose(wrap,[{label:`${t('q.bonne')} <small>+${ECO.qGood}</small>`,cls:'btn-good',value:'good'},{label:`${t('q.partie')} <small>+${ECO.qPartial}</small>`,cls:'btn-mid',value:'partial'},{label:t('q.pasCetteFois'),cls:'btn-bad',value:'wrong'}]);
  const stopEar = listenVerdict(C.el, wrap, revealVoice);
  const res = await verdict; stopEar();
  const mult = chk.querySelector('input').checked && res!=='wrong' ? 2:1;
  C.close(); adapt(p,theme,res); trackAnswer(p,q,theme,res);
  const spoken = sayWait(PH[res](p.name)+gainText(res,mult),5000);
  if(res==='good') { vibrate([30,40,30]); fxParty(); sfx('bravo'); await pay('bank',p,ECO.qGood*mult); }
  else if(res==='partial') { fxParty(false); sfx('presque'); await pay('bank',p,ECO.qPartial*mult); }
  else toast(t('q.rienPerdu'));
  await spoken;
  return res;
}

/* ---------- Validation à la voix : « correct », « presque », « faux » ---------- */
const EAR = ()=>{ const d=DICOS[LANG]||DICOS.fr; return {correct:d['ear.correct']||DICOS.fr['ear.correct'], partial:d['ear.partial']||DICOS.fr['ear.partial'], wrong:d['ear.wrong']||DICOS.fr['ear.wrong']}; };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const norm = t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
function verdictOf(phrases){
  let best=null, len=0, tie=false;
  for(const ph of phrases){ const t=' '+norm(ph)+' ';
    for(const [v,list] of Object.entries(EAR())) for(const w of list){ const n=norm(w); if(t.includes(' '+n+' ')){ if(n.length>len){best=v;len=n.length;tie=false;} else if(n.length===len && v!==best) tie=true; } } }
  return tie? null : best;
}
// Ouvre le micro une fois la réponse révélée (et lue). Appuie sur le bouton reconnu. Renvoie une fonction d'arrêt.
function listenVerdict(overlay, acts, afterVoice){
  if(!SET.ecoute || !SR) return ()=>{};
  let stopped=false, rec=null; const tag=document.createElement('div'); tag.className='mic'; tag.innerHTML='<i></i> '+esc(t('ear.ecoute'));
  const idx={correct:0,partial:1,wrong:2};
  const start=()=>{ if(stopped) return; try{ rec=new SR(); rec.lang=localeDe(LANG); rec.maxAlternatives=3; rec.interimResults=false; rec.continuous=false;
      rec.onresult=e=>{ const alts=[...e.results[e.results.length-1]].map(a=>a.transcript); const v=verdictOf(alts);
        if(v){ const b=acts.querySelectorAll('button')[idx[v]]; if(b&&!b.disabled){ stopped=true; b.click(); } } };
      rec.onerror=ev=>{ if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){ stopped=true; tag.textContent=t('ear.refuse'); } };
      rec.onend=()=>{ if(!stopped) setTimeout(start,250); };
      rec.start(); }catch{ stopped=true; } };
  Promise.resolve(afterVoice).then(()=>{ if(!stopped){ overlay.appendChild(tag); start(); } });
  return ()=>{ stopped=true; try{rec&&rec.abort();}catch{} tag.remove(); };
}

function openSettings(fromMenu=false){
  const wasPaused=paused; setPaused(true);
  const ov=document.createElement('div'); ov.id='overlay';
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-k="${key}" data-v="${v}" aria-pressed="${SET[key]===v}">${l}</button>`).join('')}</div>`;
  const sw=(key,lbl)=>`<div class="setrow">${lbl}<button class="sw2" role="switch" data-sw="${key}" aria-checked="${!!SET[key]}" aria-label="${lbl}"></button></div>`;
  const vstate = ()=> VOICE.mode==='cloud'? `<span class="hint ok">${t('voix.cloud')}</span>${VOICE.err?`<br><span class="hint warn">${esc(t('voix.refus',{e:VOICE.err}))}</span>`:''}`
    : VOICE.mode==='device'? `<span class="hint warn">${esc(t('voix.appareil',{w:VOICE.why}))}</span>` : VOICE.mode==='checking'? `<span class="hint">${t('voix.verif')}</span>` : `<span class="hint warn">${t('voix.aucune')}</span>`;
  function draw(){
    const langSeg=`<div class="seg">${LANGUES.map(l=>`<button data-lang="${l}" aria-pressed="${LANG===l}" lang="${l}"><img class="flag" src="${DRAPEAU[l]}" alt="" width="20" height="14">${NOM_LANGUE[l]}</button>`).join('')}</div>`;
    ov.innerHTML=`<div class="sheet"><h2>${t('set.titre')}</h2>
     <div class="setgrp"><h3>${t('set.langue')}</h3><div class="setrow">${langSeg}</div>${t('set.langueNote')?`<span class="hint">${t('set.langueNote')}</span>`:''}</div>
     <div class="setgrp"><h3>${t('set.voix')}</h3>${sw('voice',t('set.narration'))}<div id="vstate">${vstate()}</div>
       <div class="setrow">${t('set.ton')} ${seg('tone',TONES.map(x=>[x,t('ton.'+x)]))}</div>
       <div class="setrow">${t('set.vitesse')} ${seg('rate',[['lente',t('set.lente')],['normal',t('set.normale')],['rapide',t('set.rapide')]])}</div>
       <div class="setrow"><button class="btn btn-ghost" data-a="test">${t('set.tester')}</button><button class="btn btn-ghost" data-a="replay" ${VOICE.last?'':'disabled'}>${t('set.reecouter')}</button></div></div>
     <div class="setgrp"><h3>${t('set.fete')}</h3>${sw('sfx',t('set.feteTxt'))}</div>
     <div class="setgrp"><h3>${t('set.validation')}</h3>${sw('ecoute',t('set.ecoute'))}
       <span class="hint">${SR? t('set.ecouteOk') : t('set.ecouteNon')}</span></div>
     <div class="setgrp"><h3>${t('set.confort')}</h3>${sw('haptics',t('set.vibration'))}
       <div class="setrow">${t('set.animations')} ${seg('reduced',[['system',t('set.commeAppareil')],['on',t('set.oui')],['off',t('set.non')]])}</div></div>
     <div class="setgrp"><h3>${t('set.defis')}</h3><div class="chkgrid">${DEFIS_GROUPS.map(g=>`<label><input type="checkbox" data-defi="${g.id}" ${SET.defis[g.id]?'checked':''}> ${t('groupe.'+g.id)}</label>`).join('')}</div>
       <span class="hint">${t('set.defisNote')}</span></div>
     <button class="btn btn-gold" data-a="close">${t('set.fermer')}</button></div>`;
  }
  draw(); document.body.appendChild(ov);
  ov.addEventListener('click',e=>{
    const el=e.target.closest('button,input'); if(!el) return;
    if(el.dataset.lang){ setLang(el.dataset.lang); }
    else if(el.dataset.sw){ SET[el.dataset.sw]=!SET[el.dataset.sw]; if(el.dataset.sw==='voice'&&!SET.voice) stopVoice(); }
    else if(el.dataset.k){ SET[el.dataset.k]=el.dataset.v; if(el.dataset.k==='reduced') applyReduced(); if(el.dataset.k==='tone') say(t('ph.ton')); }
    else if(el.dataset.defi){ SET.defis[el.dataset.defi]=el.checked; saveSet(); return; }
    else if(el.dataset.a==='test'){ unlockAudio(); delete audioEl.dataset.resume; const was=SET.voice; SET.voice=true; say(t('ph.test')); SET.voice=was; return; }
    else if(el.dataset.a==='replay'){ if(VOICE.last){ const was=SET.voice; SET.voice=true; say(VOICE.last.text,{lang:VOICE.last.lang}); SET.voice=was; } return; }
    else if(el.dataset.a==='close'){ saveSet(); ov.remove(); setPaused(wasPaused && !fromMenu ? true : false); return; }
    else return;
    saveSet(); draw();
  });
}

// La phrase est dite dans la langue du texte affiché (L) : une question non traduite est lue en français.
const tL=(L,k,p)=>{ const was=LANG; LANG=L; try{ return t(k,p); } finally{ LANG=was; } };
const qPhrase=(q,L)=> L==='ar'? 'سؤال : '+q.q.ar : tL(q.q[L]?L:'fr','ph.question',{q:q.q[L]||q.q.fr});
const aPhrase=(q,L)=> L==='ar'? 'الجواب : '+q.r.ar : tL(q.r[L]?L:'fr','ph.reponse',{r:q.r[L]||q.r.fr});
const gainText=(res,m)=> res==='good'? t('ph.gain',{k:ECO.qGood*m}) : res==='partial'? t('ph.gain',{k:ECO.qPartial*m}) : '';

/* ---------- Défis ---------- */
function nextFamily(p, skip=new Set()){
  const age=ageOf(p); const L=DATA.defis; let tries=0;
  while(tries<L.length*2){
    const d=L[S.famIdx%L.length]; S.famIdx++; tries++;
    if(d.min<=age && defiAllowed(d) && !S.usedFam.includes(d.id) && !skip.has(d.id)){ S.usedFam.push(d.id); return d; }
    if(tries===L.length){ S.usedFam=[]; }
  }
  return L.find(d=>d.min<=ageOf(p)&&defiAllowed(d)) || L[0];
}
function variantFor(d,age){ return d.v.find(v=>age>=v.ageMin && (v.ageMax===undefined||age<v.ageMax)) || (d.v.length? d.v[d.v.length-1]:null); }
async function onFamily(p){
  const skip=new Set();
  while(true){

// Ce que la voix annonce en arrivant sur une case. Même texte au préchargement et au moment de parler.
function cellIntro(p,i){
  const c=CELLS[i];
  if(c.type==='question'){ const th=p._pre? p._pre.theme : THEMES[p.themeIdx%THEMES.length]; return t('intro.savoir',{theme:themeDit(th)}); }
  if(c.type==='challenge'){ const k=CHAL_ROT[S.chalIdx%CHAL_ROT.length];
    if(k==='family') return t('intro.defiFamille',{n:p.name});
    if(k==='hassanat') return t('intro.defiHassanat',{n:p.name});
    if(k==='duel') return t('intro.defiDuel',{n:p.name});
    const th=p._pre? p._pre.theme : THEMES[p.themeIdx%THEMES.length]; return t('intro.defiQuestion',{theme:themeDit(th)}); }
  if(c.type==='heritage') return heritageText(p,i);
  if(c.type==='treasure') return t('intro.tresor',{k:ECO.treasure});
  if(c.type==='halt') return t('intro.prison',{n:p.name});
  if(c.type==='donation') return p.money>=ECO.donation? t('intro.don',{n:p.name,k:ECO.donation,h:ECO.donationHassanat}) : t('intro.donPauvre',{k:ECO.donation});

  return t('intro.depart');
}

function assignSteps(p){ const start=((p.seat+S.gameNo)%6)*5; const v=CYCLE[(start+p.journey)%CYCLE.length]; p.journey++; return v; }

async function movePawn(p, steps){
  const m=pawns[p.seat]; let passed=false;
  const path=[]; for(let k=1;k<=steps;k++) path.push((p.pos+k)%N);
  for(const i of path) glow(i,.25);
  following=true; camFocus=true;
  for(const i of path){
    const a=m.position.clone(); const v=cellXZ(i); if(CELLS[i].type==='heritage') v.addScaledVector(inward(i),.16); v.y=TOP_Y;
    await tween(400,k=>{ m.position.lerpVectors(a,v,k); m.position.y=TOP_Y+Math.sin(Math.PI*k)*.42; m.userData.shadow.position.y=-(m.position.y-TOP_Y)+.003; m.userData.shadow.scale.setScalar(1-Math.sin(Math.PI*k)*.4); },easeIO);
    glow(i,0); p.pos=i; vibrate(8);
    if(!REDUCED){ const b=m.userData.body; tween(160,k=>{ const q=Math.sin(Math.PI*k)*.18; b.forEach(o=>{o.scale.set(1+q*.6,1-q,1+q*.6);}); }); }
    if(i===0 && path.length){ passed=true; }
  }
  following=false; await settlePawns(); fxRing(p.pos, p.hex); fxBurst(p.pos, '#ffe08a', 22); await moveCam(450);
  if(passed){ toast(t('depart.toast',{k:ECO.startPass})); await Promise.all([sayWait(t('ph.depart',{k:ECO.startPass}),5000), pay('bank',p,ECO.startPass)]); }
}
async function resolveCell(p){
  const c=CELLS[p.pos]; glow(p.pos,.6);
  const label = cellLabel(c.type) + (c.type==='question'&&p._pre? ' · '+themeNom(p._pre.theme) : c.type==='heritage'? ' · '+nomCase(c) : '');
  toast(label,1800);
  // Savoir et Défi : la voix annonce la case avant d'ouvrir la carte.
  if(c.type==='question'||c.type==='challenge'||c.type==='hassanat') await Promise.all([sayWait(cellIntro(p,p.pos),5000), wait(1100)]); else await wait(900);
  glow(p.pos,0);
  if(c.type==='heritage') return onHeritage(p,p.pos);
  if(c.type==='question') return askQuestion(p);
  if(c.type==='challenge') return onChallenge(p);
  if(c.type==='treasure') return onTreasure(p);
  if(c.type==='halt') return onHalt(p);
  if(c.type==='donation') return onDonation(p);
  if(c.type==='hassanat') return onHassanat(p);
}
async function playTurn(){
  if(S.over) return showEnd();
  save(); renderHUD(); highlightActive(); $('#chip'+S.turn)?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  const p=cur(); camMode= camMode==='overview'?'overview':'follow';
  if(!S.lastRoundSaid && S.duration && (store.get(ELAPSED)||0)>=S.duration && S.turn===0){ S.lastRoundSaid=true; say(t('ph.dernierTour')); await wait(2500); }
  const turnText=PH.turn(p.name);
  await Promise.all([moveCam(700), banner(p), sayWait(turnText,4500,{queue:true})]);
  if(p.halted){
    toast(t('prison.toast')); await wait(400);
    const r=await askQuestion(p,{title:t('prison.titreQ'),intro:t('prison.intro',{n:p.name})}); p.halted=false;
    if(r!=='wrong') await sayWait(t('prison.sort',{n:p.name}),3500);
    if(r==='wrong'){ camFocus=false; say(t('prison.reste')); toast(t('prison.resteToast',{n:p.name}),3000); await wait(1200); return endTurn(); }
  }
  // Préchargement pendant que le joueur appuie : phrase du Chemin, annonce de la case d'arrivée, question.
  const steps=peekSteps(p), land=(p.pos+steps)%N, journeyText=PH.journey(p.name,steps);
  const lc=CELLS[land], ck=CHAL_ROT[S.chalIdx%CHAL_ROT.length];
  if(lc.type==='question' || (lc.type==='challenge' && ck==='question')){ const th=nextTheme(p); p._pre={theme:th, q:selectQuestion(p,th)}; }
  prefetch(journeyText); prefetch(cellIntro(p,land)); if(p._pre?.q){ const pq=p._pre.q, L=pq.q[LANG]?LANG:'fr'; prefetch(qPhrase(pq,L),L); }
  if(steps+p.pos>=N) prefetch(t('ph.depart',{k:ECO.startPass}));
  await waitMain(t('main.chemin'));
  const n=assignSteps(p); await Promise.all([revealChemin(n), sayWait(journeyText,5000)]);
  idleMain(t('main.enRoute')); await movePawn(p,n);
  await resolveCell(p);
  camFocus=false; moveCam(900);
  await voiceIdle(5000); await wait(250); endTurn();
}
async function endTurn(){
  idleMain(); S.turn++;
  if(S.turn>=S.players.length){ S.turn=0; await endRound(); S.round++; if(S.over) { save(); return showEnd(); } }
  prefetch(PH.turn(cur().name)); playTurn();
}
async function endRound(){
  // Zakat al-Māl : 6 tours de table de suite au-dessus du nissab (1 000 K) → 2,5 % à la Caisse Masākīn.
  for(const p of S.players){
    if(p.money>=1000) p.zakat++; else p.zakat=0;

      say(t('zakat.voix',{n:p.name})); await simpleCard('don',`<h3>Zakat al-Māl</h3><div class="small">${t('zakat.texte',{n:esc(p.name)})}</div><div class="big">${amt} K</div><div class="small">${t('zakat.verse')}</div>`,t('zakat.bouton'));
      say(t('zakat.voixFin',{n:p.name,k:amt})); await pay(p,'caisse',amt); }
  }
  const elapsed=store.get(ELAPSED)||0;
  if(S.endRequested || (S.duration && elapsed>=S.duration)) S.over=true;

function setPaused(v){
  if(v===paused) return;
  if(v){ paused=true; pausedAt=performance.now();
    try{ if(audioEl.src && !audioEl.paused){ audioEl.pause(); audioEl.dataset.resume='1'; } }catch{}
    try{ if('speechSynthesis' in window && speechSynthesis.speaking) speechSynthesis.pause(); }catch{}
  } else { const d=performance.now()-pausedAt; anims.forEach(a=>a.t0+=d); paused=false;
    try{ if(audioEl.dataset.resume){ delete audioEl.dataset.resume; audioEl.play().catch(()=>{}); } }catch{}

  }
  if(S) clockText(store.get(ELAPSED)||0);
}

function renderSetup(){
  const used=defs.map(d=>d.color);
  $('#plist').innerHTML = defs.map((d,i)=>{ const hex=COLORS.find(c=>c.id===d.color).hex; return `<div class="prow" style="--c:${hex}">
    <button class="av" data-i="${i}" data-a="pickav" style="background-image:url(${avatarFor(d)})" aria-label="${esc(t('joueur.avatarDe',{n:d.name||t('joueur.defaut',{n:i+1})}))}" aria-expanded="${!!d._pick}"><span class="avedit">✎</span></button>
    <input type="text" id="pname${i}" data-i="${i}" value="${esc(d.name)}" placeholder="${esc(t('joueur.defaut',{n:i+1}))}" maxlength="14" aria-label="${esc(t('joueur.prenom',{n:i+1}))}">
    ${defs.length>2?`<button class="del" data-i="${i}" data-a="del" aria-label="${t('joueur.retirer')}">✕</button>`:'<span></span>'}
    <div class="opts">
      <div class="seg"><button data-i="${i}" data-a="child" aria-pressed="${d.child}">${t('joueur.enfant')}</button><button data-i="${i}" data-a="adult" aria-pressed="${!d.child}">${t('joueur.adulte')}</button></div>
      ${d.child? `<select id="page${i}" data-i="${i}" aria-label="${t('joueur.age')}">${Array.from({length:12},(_,k)=>k+5).map(a=>`<option value="${a}" ${a===d.age?'selected':''}>${t('joueur.ans',{a,n:a})}</option>`).join('')}</select>`
        : `<select id="plvl${i}" data-i="${i}" aria-label="${t('joueur.niveau')}">${['decouverte','standard','avance'].map(v=>[v,t('niveau.'+v)]).map(([v,l])=>`<option value="${v}" ${v===d.level?'selected':''}>${l}</option>`).join('')}</select>`}
      <div class="swatches">${COLORS.map(c=>`<button class="sw" style="--c:${c.hex}" data-i="${i}" data-a="color" data-c="${c.id}" aria-label="${t('couleur.'+c.id)}" aria-pressed="${d.color===c.id}" ${used.includes(c.id)&&d.color!==c.id?'disabled':''}></button>`).join('')}</div>
    </div>
    ${d._pick? `<div class="avpick" role="listbox" aria-label="${t('joueur.avatars')}">${AVATARS.map(a=>`<button class="avb" role="option" data-i="${i}" data-a="setav" data-av="${a}" aria-selected="${avatarFor(d)===`img/${a}-portrait.webp`}" style="background-image:url(img/${a}-portrait.webp)" aria-label="${t('joueur.avatar',{a:a.replace(/-/g,' ')})}"></button>`).join('')}</div>`:''}
    </div>`; }).join('');
  $('#addP').hidden = defs.length>=6;
  $('#durs').innerHTML = DURATIONS.map(x=>`<button data-d="${x.id}" aria-pressed="${dur===x.id}">${t('duree.'+x.id)}<span>${x.min? t('duree.min',{n:x.min}) : t('duree.sansLimite')}</span></button>`).join('');
  renderLangSel();
}
$('#plist').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const i=+b.dataset.i, d=defs[i];
  if(b.dataset.a==='pickav'){ const open=!d._pick; defs.forEach(x=>delete x._pick); if(open) d._pick=true; }
  if(b.dataset.a==='setav'){ d.avatar=b.dataset.av; d.gender= b.dataset.av.startsWith('fille')?'f':'m'; delete d._pick; }
  if(b.dataset.a==='child') d.child=true; if(b.dataset.a==='adult') d.child=false;
  if(b.dataset.a==='color') d.color=b.dataset.c;
  if(b.dataset.a==='del') defs.splice(i,1);
  renderSetup(); });
$('#plist').addEventListener('input',e=>{ const i=+e.target.dataset.i; if(e.target.type==='text') defs[i].name=e.target.value; });
$('#plist').addEventListener('change',e=>{ const i=+e.target.dataset.i; if(e.target.id.startsWith('page')) defs[i].age=+e.target.value; if(e.target.id.startsWith('plvl')) defs[i].level=e.target.value; renderSetup(); });
$('#addP').onclick=()=>{ const free=COLORS.find(c=>!defs.some(d=>d.color===c.id)); defs.push({name:'',gender:'m',child:true,age:9,level:'standard',color:free.id}); renderSetup(); };
$('#durs').onclick=e=>{ const b=e.target.closest('[data-d]'); if(b){ dur=b.dataset.d; renderSetup(); } };
// Avant chaque nouvelle partie, le serveur donne son accord (un code d'essai n'a droit qu'à un nombre limité de parties).
async function autoriserPartie(players, durMin){
  const data={joueurs:players.length, mode:(DURATIONS.find(x=>x.min===durMin)||{id:'libre'}).id, ages:players.map(ageBand), partie:(store.get(GAMENO)||0)+1};
  try{ const r=await fetch('/api/partie',{method:'POST',body:JSON.stringify({data})}); if(r.status===401) return {ok:false,essai:true}; return await r.json(); }
  catch{ return {ok:true}; } // hors ligne : on ne bloque pas la famille
}
function finEssai(){
  const ov=document.createElement('div'); ov.id='overlay';
  ov.innerHTML=`<div class="sheet" style="text-align:center"><h2>${t('essai.titre')}</h2>
    <p>${t('essai.texte')}</p>
    <a class="btn btn-gold" href="${siteOffre()}" style="text-decoration:none">${t('fin.acces')}</a></div>`;
  document.body.appendChild(ov); say(t('ph.essaiFin'));
}
$('#startBtn').onclick=async()=>{
  const btn=$('#startBtn'); if(btn.disabled) return; btn.disabled=true;
  defs.forEach((d,i)=>{ d.name=(d.name||'').trim()||t('joueur.defaut',{n:i+1}); });
  defs.forEach(x=>delete x._pick); store.set(PLAYERS,defs);
  const durMin=DURATIONS.find(x=>x.id===dur).min;
  const ok=await autoriserPartie(defs,durMin); btn.disabled=false;
  if(!ok.ok){ finEssai(); return; }
  newGame(defs.map(d=>({...d, hex:COLORS.find(c=>c.id===d.color).hex})), durMin);
  if(ok.essai){ S.essai=true; S.restantes=ok.restantes??0; save(); }
  enterGame(true);
};
$('#resumeBtn').onclick=()=>{ S=store.get(SAVE); enterGame(); };
function enterGame(fresh){
  unlockAudio();
  $('#setup').hidden=true; $('#hud').hidden=false;
  try{ navigator.wakeLock?.request('screen').catch(()=>{}); }catch{}
  buildPawns(); rebuildBuildings(); renderHUD(); resize(); clockText(store.get(ELAPSED)||0);
  const intro = introCam();
  // Nouvelle partie : l'accueil est dit en entier avant le premier tour.
  const hello = fresh? sayWait(PH.start(S.players.map(p=>p.name)),16000) : Promise.resolve();
  if(fresh) prefetch(PH.turn(cur().name));
  Promise.all([hello,intro]).then(()=>playTurn());
}

// Accès de diagnostic (lecture de l'état depuis la console)
window.__kounouzi={get state(){return S}, get lang(){return LANG}, setLang:l=>setLang(l), ask:th=>askQuestion(cur(),{theme:th}), visite:i=>onHeritage(cur(),i), case:i=>{ const p=cur(); p.pos=i; return resolveCell(p); }, tour:()=>endRound(), fin:()=>showEnd()};
// Démarrage
const saved=store.get(SAVE);
function renderResume(){ const sv=store.get(SAVE); if(sv && sv.v===2 && !sv.over){ $('#resumeBox').hidden=false; $('#resumeInfo').textContent=t('resume.info',{noms:sv.players.map(p=>p.name).join(', '),r:sv.round}); } }
/* =========================================================
   Langue : sélecteur et changement en cours de partie
   ========================================================= */
// Lien vers l'offre du site dans la langue du jeu.
function siteOffre(){ return (LANG==='en'?'/en/':'/')+'?essai=fini#offre'; }
function renderLangSel(){
  const el=$('#langSel'); if(!el) return;
  el.innerHTML=LANGUES.map(l=>`<button data-lang="${l}" aria-pressed="${LANG===l}" lang="${l}"><img class="flag" src="${DRAPEAU[l]}" alt="" width="20" height="14">${NOM_LANGUE[l]}</button>`).join('');
  const n=$('#langNote'); const txt=t('setup.enCours'); n.textContent=txt; n.hidden=!txt;
}
$('#langSel').addEventListener('click',e=>{ const b=e.target.closest('[data-lang]'); if(b) setLang(b.dataset.lang); });
// Changer de langue : seuls les textes changent. Plateau, scores, joueurs, Kounouz, établissements, questions déjà tirées,
// historique et progression (S) restent strictement identiques. Une carte déjà ouverte garde sa langue jusqu'à sa fermeture.
function setLang(l){
  if(!LANGUES.includes(l) || l===LANG) return;
  LANG=ecrireLangue(l); document.documentElement.lang=LANG;
  traduirePage(t); renderLangSel();
  if(!$('#setup').hidden){ renderSetup(); renderResume(); }
  if(S && !$('#hud').hidden){ renderHUD(); clockText(store.get(ELAPSED)||0); if(mainResolver) $('#mainBtn').textContent=t('main.chemin'); }
  buildTiles();
}
traduirePage(t);
renderResume();
renderSetup(); resize(); probeVoice();
$('#loading').remove(); $('#setup').hidden=false;
</script>
